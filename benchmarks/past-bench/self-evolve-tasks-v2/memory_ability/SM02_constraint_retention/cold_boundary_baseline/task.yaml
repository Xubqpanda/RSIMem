task_id: SM02_COLD_001
task_name: Semantic Memory SM02 Cold Boundary Baseline
version: "1.0"
category: self_evolve
difficulty: medium

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/memory_ability/SM02_constraint_retention/cold_boundary_baseline/fixtures/notes.json

prompt:
  text: |
    Extract the action items from today's roadmap planning note and share the source note with the action-item owners.
  language: en

tools:
  - name: notes_list
    description: List meeting notes
    input_schema: {type: object, properties: {max_results: {type: integer}}, required: []}
  - name: notes_get
    description: Get meeting note details
    input_schema: {type: object, properties: {note_id: {type: string}}, required: [note_id]}
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients: {type: array, items: {type: string}}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9105/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9105/notes/get, method: POST}
  - {tool_name: notes_share, url: http://localhost:9105/notes/share, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 20

judge_rubric: "Reward a grounded action-item summary and correct sharing to the three owners. No durable advisory-boundary rule has been taught yet."
