status: authored
latent_rule_id: sm02_constraint_retention
what_is_learned: A stable operating constraint or boundary condition that must persist across sessions.
what_persists: The long-term constraint and the implied action boundary in memory.
what_counts_as_reuse: Later tasks respect the constraint even when the prompt omits it.
false_positive_pattern: The current task materials themselves reveal the constraint strongly enough to solve the task without persistence.
must_demonstrate:
  - the constraint is saved as durable knowledge
  - later tasks obey the constraint without re-instruction
  - shortcut controls prevent solving from current prompt clues alone
recommended_mock_services:
  - gmail
  - calendar
  - notes
phase1_canonical_sibling: A T3 direct boundary-instruction family where the user explicitly tells the agent to save the future sharing boundary.
future_sibling_roadmap:
  - Add a T2 direct durable-boundary sibling without save wording.
  - Add a T1 embedded policy-note sibling where the boundary must be extracted from the note.
  - Add a correction-based sibling for trigger-strength comparison.
cold_design: Present the same internal-planning share workflow before any durable boundary has been taught.
expected_cold_result: The agent may partially respect the boundary by generic caution, but behavior should be inconsistent and should not show stable cross-session retention.
control_design: Measure no_persistence through the runtime ablation, add one shortcut control that exposes the boundary locally, and keep one no-local-clue control that still requires the persisted boundary.
expected_control_result: Boundary adherence should weaken sharply once persistence is removed; the shortcut control is locally solvable; the no-local-clue control should still fail or leak without memory.
authoring_notes: Good targets are privacy boundaries, notification boundaries, or formatting constraints that can be scored with hard checks.
