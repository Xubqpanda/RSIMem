task_id: EP02_I08_control_wrong_mechanism
task_name: 'EP02 Exception List Recall — Control Wrong Mechanism'

services:
  - name: config
    command: python mock_services/config/server.py
    port: 9210
    health_check: http://localhost:9210/config/integrations
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9210/config/reset
    env:
      CONFIG_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f04_config/control_wrong_mechanism.json
      PORT: "9210"

tools:
  - name: config_list_integrations
    description: List all integrations
    input_schema:
      type: object
      properties:
        region:
          type: string
        status:
          type: string
      required: []
  - name: config_get_integration
    description: Get integration details
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
      required: [integration_id]
  - name: config_update_integration
    description: Update integration config
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
        status:
          type: string
        exception_approved:
          type: boolean
        notes:
          type: string
      required: [integration_id]

tool_endpoints:
  - {tool_name: config_list_integrations, url: http://localhost:9210/config/integrations, method: POST}
  - {tool_name: config_get_integration, url: http://localhost:9210/config/integrations/get, method: POST}
  - {tool_name: config_update_integration, url: http://localhost:9210/config/integrations/update, method: POST}

prompt:
  text: |
    A convenience cache may already claim to know the Wave Cedar carry-forward
    subset. Keep this queue aligned with the same narrow handling that was
    already settled earlier, and do not widen the allowance just because a
    durable cache says otherwise.
    Output: BATCH|reactivated_ids|still_blocked_ids
  language: en

judge_rubric: "Reward ignoring the decoy durable cache and reactivating exactly INTG-EU-002, INTG-US-004, and INTG-AP-006 while keeping INTG-EU-013, INTG-US-014, and INTG-AP-015 suspended. The correct mechanism remains prior-session recall, not durable memory stuffing."

requires_fresh_session: true

environment:
  timeout_seconds: 300
  max_turns: 20
category: self_evolve
difficulty: medium
