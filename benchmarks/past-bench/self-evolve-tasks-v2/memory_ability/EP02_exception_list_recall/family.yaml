- shortcut
- wrong_mechanism
status: authored
scope_note: "Canonical 8-episode slice keeps a single session-bounded restart subset, then branches eval and controls from the saved post-learn anchor. I08 overlays a decoy durable memory while still scoring session_search as the expected substrate."
latent_rule_id: ep02_exception_list_recall_v1
what_is_learned: A session-bounded restart subset for Wave Cedar that must be recalled later from prior-session history without being restated.
what_persists: Prior session content retrievable via session_search; the restart subset remains episodic rather than becoming a standing policy.
what_counts_as_reuse: Agent recovers the prior restart subset on a vague follow-up cue and reactivates only the previously cleared connectors while leaving matched distractors suspended.
false_positive_pattern: Agent infers the subset from local hints in the current batch, or trusts a durable memory/cache artifact instead of grounding the decision in episodic retrieval.
must_demonstrate:
- exception set is recoverable via session search
- exceptions are not elevated into durable memory
- application to eval uses the correct subset across multiple candidates
episode_overrides:
  EP02_I08_control_wrong_mechanism:
    mechanism: mixed
    expected_persistence_signal: session_search
    persistence_allowed: true
    preseed_artifacts_dir: self-evolve-tasks-v2/_shared/preseed/ep02_wrong_mechanism_memory
trigger_phrases:
- session-bounded restart exception
- Wave Cedar carry-forward subset
banned_phrases: []
stale_phrases: []
calibration_baseline_score: null
saturation_ceiling: 0.85
