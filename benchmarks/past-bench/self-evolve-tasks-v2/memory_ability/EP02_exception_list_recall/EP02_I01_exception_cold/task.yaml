task_id: EP02_I01_exception_cold
task_name: 'EP02 Exception List Recall — Cold Baseline'

services:
  - name: config
    command: python mock_services/config/server.py
    port: 9210
    health_check: http://localhost:9210/config/integrations
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9210/config/reset
    env:
      CONFIG_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f04_config/cold.json
      PORT: "9210"

tools:
  - name: config_list_integrations
    description: List all integrations
    input_schema:
      type: object
      properties:
        region:
          type: string
        status:
          type: string
      required: []
  - name: config_get_integration
    description: Get integration details
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
      required: [integration_id]
  - name: config_update_integration
    description: Update integration config
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
        status:
          type: string
        exception_approved:
          type: boolean
        notes:
          type: string
      required: [integration_id]

tool_endpoints:
  - {tool_name: config_list_integrations, url: http://localhost:9210/config/integrations, method: POST}
  - {tool_name: config_get_integration, url: http://localhost:9210/config/integrations/get, method: POST}
  - {tool_name: config_update_integration, url: http://localhost:9210/config/integrations/update, method: POST}

prompt:
  text: |
    Review the Wave Cedar suspended connectors and determine whether any of
    them already have a previously approved carry-forward subset on record in
    this session. If none do, say so explicitly and keep every connector
    suspended.
    Output: BATCH|approved_ids_or_none|blocked_ids
  language: en

judge_rubric: "Reward a grounded cold-start answer that inspects the suspended candidates, reports that no prior carry-forward subset is available yet, keeps every connector suspended, and avoids inventing historical approvals."

environment:
  timeout_seconds: 300
  max_turns: 20
category: self_evolve
difficulty: medium
