task_id: EP02_I03_context_noise
task_name: 'EP02 Exception List Recall — Context Noise'

services:
  - name: config
    command: python mock_services/config/server.py
    port: 9210
    health_check: http://localhost:9210/config/integrations
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9210/config/reset
    env:
      CONFIG_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f04_config/context.json
      PORT: "9210"

tools:
  - name: config_list_integrations
    description: List all integrations
    input_schema:
      type: object
      properties:
        region:
          type: string
        status:
          type: string
      required: []
  - name: config_get_integration
    description: Get integration details
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
      required: [integration_id]
  - name: config_update_integration
    description: Update integration config
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
        status:
          type: string
        exception_approved:
          type: boolean
        notes:
          type: string
      required: [integration_id]

tool_endpoints:
  - {tool_name: config_list_integrations, url: http://localhost:9210/config/integrations, method: POST}
  - {tool_name: config_get_integration, url: http://localhost:9210/config/integrations/get, method: POST}
  - {tool_name: config_update_integration, url: http://localhost:9210/config/integrations/update, method: POST}

prompt:
  text: |
    Audit the APAC compliance backlog and summarize the suspended items. Do
    not change any previously settled Wave Cedar restart decisions in this
    batch.
    Output: AUDIT|suspended_ids|notes
  language: en

judge_rubric: "Reward a grounded APAC audit that stays on the current batch and does not mutate the earlier Wave Cedar restart subset. This episode exists only to add distance before the later recall."

environment:
  timeout_seconds: 300
  max_turns: 20
category: self_evolve
difficulty: medium
