task_id: EP02_I04_eval_near
task_name: 'EP02 Exception List Recall — Eval Near'

services:
  - name: config
    command: python mock_services/config/server.py
    port: 9210
    health_check: http://localhost:9210/config/integrations
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9210/config/reset
    env:
      CONFIG_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f04_config/eval_near.json
      PORT: "9210"

tools:
  - name: config_list_integrations
    description: List all integrations
    input_schema:
      type: object
      properties:
        region:
          type: string
        status:
          type: string
      required: []
  - name: config_get_integration
    description: Get integration details
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
      required: [integration_id]
  - name: config_update_integration
    description: Update integration config
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
        status:
          type: string
        exception_approved:
          type: boolean
        notes:
          type: string
      required: [integration_id]

tool_endpoints:
  - {tool_name: config_list_integrations, url: http://localhost:9210/config/integrations, method: POST}
  - {tool_name: config_get_integration, url: http://localhost:9210/config/integrations/get, method: POST}
  - {tool_name: config_update_integration, url: http://localhost:9210/config/integrations/update, method: POST}

prompt:
  text: |
    Continue the Wave Cedar queue the same narrow way it was already settled
    earlier in this rollout line. Reactivate only the same previously cleared
    subset and keep every other candidate suspended.
    Output: BATCH|reactivated_ids|still_blocked_ids
  language: en

judge_rubric: "Reward recovering the previously settled Wave Cedar subset and reactivating exactly INTG-EU-002, INTG-US-004, and INTG-AP-006 while leaving INTG-EU-013, INTG-US-014, and INTG-AP-015 suspended. Do not award full credit for guessing from current-batch clues alone."

requires_fresh_session: true

environment:
  timeout_seconds: 300
  max_turns: 20
category: self_evolve
difficulty: medium
