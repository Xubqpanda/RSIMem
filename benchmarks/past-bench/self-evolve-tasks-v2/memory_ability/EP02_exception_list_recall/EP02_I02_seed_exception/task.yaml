task_id: EP02_I02_seed_exception
task_name: 'EP02 Exception List Recall — Seed Exception Set'

services:
  - name: config
    command: python mock_services/config/server.py
    port: 9210
    health_check: http://localhost:9210/config/integrations
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9210/config/reset
    env:
      CONFIG_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f04_config/seed.json
      PORT: "9210"

tools:
  - name: config_list_integrations
    description: List all integrations
    input_schema:
      type: object
      properties:
        region:
          type: string
        status:
          type: string
      required: []
  - name: config_get_integration
    description: Get integration details
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
      required: [integration_id]
  - name: config_update_integration
    description: Update integration config
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
        status:
          type: string
        exception_approved:
          type: boolean
        notes:
          type: string
      required: [integration_id]

tool_endpoints:
  - {tool_name: config_list_integrations, url: http://localhost:9210/config/integrations, method: POST}
  - {tool_name: config_get_integration, url: http://localhost:9210/config/integrations/get, method: POST}
  - {tool_name: config_update_integration, url: http://localhost:9210/config/integrations/update, method: POST}

prompt:
  text: |
    For Wave Cedar, approve a session-bounded restart exception only for
    INTG-EU-002, INTG-US-004, and INTG-AP-006. Leave INTG-EU-013,
    INTG-US-014, and INTG-AP-015 suspended. For the approved subset only,
    set status=active, set exception_approved=true, and record a note that says:
    "Wave Cedar carry-forward subset; session-bounded restart exception only."
    Output: BATCH|approved_ids|blocked_ids
  language: en

judge_rubric: "Reward activating and approving exactly INTG-EU-002, INTG-US-004, and INTG-AP-006 for the Wave Cedar session-bounded restart exception, while leaving INTG-EU-013, INTG-US-014, and INTG-AP-015 suspended. This episodic subset must remain available for later recall without becoming a standing rule."

environment:
  timeout_seconds: 300
  max_turns: 20
category: self_evolve
difficulty: medium
