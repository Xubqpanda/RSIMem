task_id: EP02_I06_control_no_persistence
task_name: 'EP02 Exception List Recall — Control No Persistence'

services:
  - name: config
    command: python mock_services/config/server.py
    port: 9210
    health_check: http://localhost:9210/config/integrations
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9210/config/reset
    env:
      CONFIG_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f04_config/control_no_persistence.json
      PORT: "9210"

tools:
  - name: config_list_integrations
    description: List all integrations
    input_schema:
      type: object
      properties:
        region:
          type: string
        status:
          type: string
      required: []
  - name: config_get_integration
    description: Get integration details
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
      required: [integration_id]
  - name: config_update_integration
    description: Update integration config
    input_schema:
      type: object
      properties:
        integration_id:
          type: string
        status:
          type: string
        exception_approved:
          type: boolean
        notes:
          type: string
      required: [integration_id]

tool_endpoints:
  - {tool_name: config_list_integrations, url: http://localhost:9210/config/integrations, method: POST}
  - {tool_name: config_get_integration, url: http://localhost:9210/config/integrations/get, method: POST}
  - {tool_name: config_update_integration, url: http://localhost:9210/config/integrations/update, method: POST}

prompt:
  text: |
    Continue this Wave Cedar queue using only the same previously settled
    narrow subset. If that subset is not recoverable from the available
    context, do not guess and do not widen the allowance.
    Output: BATCH|reactivated_ids_or_none|still_blocked_ids
  language: en

judge_rubric: "Judge this no-persistence control against the same latent target as the eval episodes: the task would still be to recover and apply the previously settled Wave Cedar subset (INTG-EU-002, INTG-US-004, INTG-AP-006) while leaving INTG-EU-013, INTG-US-014, and INTG-AP-015 blocked. However, persistence is unavailable here, so successful recovery should normally fail. Limited credit is appropriate if the agent explicitly recognizes that the prior subset is not recoverable and refuses to guess, but abstention is not task success and must remain well below eval-level performance. Penalize any guessed reactivation, including lucky guesses, when no retrievable prior-session evidence exists."

requires_fresh_session: true

environment:
  timeout_seconds: 300
  max_turns: 20
category: self_evolve
difficulty: medium
