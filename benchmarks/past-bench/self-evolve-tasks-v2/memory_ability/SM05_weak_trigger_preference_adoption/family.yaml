family_id: SM05_weak_trigger_preference_adoption
title: Weak-Trigger Preference Adoption
ability_dir: memory_ability
primary_ability: memory_ability
secondary_abilities: []
primary_trigger: explicit_instruction
trigger_category: direct_explicit_instruction
trigger_strength: T2
trigger_visibility_paths:
  - direct_user_message
  - required_document_or_note_reading
benchmark_role: diagnostic_sibling
compatibility_gate: diagnostic
trigger_class: explicit_instruction
secondary_triggers: []
optional_supporting_trigger: embedded_durable_instruction
supporting_stage: update_or_stabilize
supporting_signal: the note embeds the standing summary preference instead of restating it directly in the user message
supporting_signals: []
distractor_signals: []
trigger_injection_plan:
  learn_a: explicit T3 preference seed asks the agent to save the durable TSV column structure for future sessions.
  learn_b: weaker T2 direct instruction introduces a separate durable priority-normalization rule without explicit save wording.
  update_or_stabilize: T1 embedded note memo introduces a separate due-date normalization rule and the prompt only tells the agent to adopt any standing team preference found in the note.
primary_trigger_stages:
  - learn_a
  - learn_b
trigger_removal_plan:
  eval_near: remove all preference wording and leave only the new note-processing request.
  eval_far: keep the preference fully implicit under larger surface shift.
trigger_mixing_rule: Do not mix conflict_update into this family. The diagnostic question is whether independent non-conflicting preference slots delivered through T3, T2, and T1 triggers are acquired and later reused.
sibling_comparison_plan: Compare against SM01_preference_adoption as the stronger canonical anchor and use this family as the weak-trigger diagnostic sibling.
expected_substrate: memory
autonomy_required: true
evaluation_requires_reuse: true
transfer_distance: near_far
overwrite_mode: not_required
noise_profile: medium
family_length_tier: tier3
implementation_priority: phase1
instances_per_bucket:
