status: authored
latent_rule_id: sm05_weak_trigger_preference_adoption
what_is_learned: "Three durable, non-conflicting formatting preference slots should be acquired from different trigger strengths: T3 teaches TSV structure, T2 teaches priority normalization, and T1 embedded note text teaches date normalization."
what_persists: The three stable formatting slots and their application policy in memory.
what_counts_as_reuse: Later tasks simultaneously use TSV structure, normalized priority labels, and normalized dates without restating any of the three rules.
false_positive_pattern: The evaluation task succeeds only because the current note repeats the formatting rules, or because the T3 TSV slot is learned while the weaker T2/T1 slots are ignored.
must_demonstrate:
  - the T3 TSV-structure slot can be stored
  - the T2 priority-normalization slot can be stored independently of the T3 slot
  - the T1 embedded due-date slot can be extracted and stored from note content
  - fresh-session eval applies all three slots without any local clue
recommended_mock_services:
  - notes
phase1_canonical_sibling: SM01_preference_adoption remains the clean T3 anchor; this family is the weak-trigger diagnostic sibling for the same latent preference class.
future_sibling_roadmap:
  - Add a pure T1-only version with all slots embedded in notes if the family needs a harsher acquisition probe.
  - Add an explicit_correction sibling to compare weak instruction versus weak correction triggers.
  - Add retrieval-timing instrumentation checks before the first external action if attribution needs to be harder.
cold_design: Use the same note workflow before any formatting preference has been taught and let the agent answer in its default style.
expected_cold_result: The agent may produce a readable summary, but TSV adherence and normalized labels should be unstable.
control_design: no_persistence removes durable storage; shortcut exposes all three formatting slots inline; wrong_mechanism embeds all three rules inside the current note instead of memory.
expected_control_result: Format adherence should drop without persistence, shortcut should be locally solvable, and wrong_mechanism should show that current-document delivery differs from memory reuse.
authoring_notes: This family intentionally maps T3, T2, and T1 trigger strength to three independent non-conflicting rule slots so eval can attribute which trigger slot failed. It is a diagnostic sibling rather than a clean anchor.
