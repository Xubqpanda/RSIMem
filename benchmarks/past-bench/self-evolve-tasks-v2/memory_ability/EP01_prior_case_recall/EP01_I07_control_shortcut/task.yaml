task_id: EP01_I07_control_shortcut
task_name: 'EP01 Prior Case Recall — Control Shortcut'

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9205
    health_check: http://localhost:9205/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9205/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/ep01_notes/control_shortcut.json
      PORT: "9205"

tools:
  - name: notes_list
    description: List meeting notes
    input_schema:
      type: object
      properties:
        tags:
          type: array
          items: {type: string}
      required: []
  - name: notes_get
    description: Get a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
      required: [note_id]
  - name: notes_update
    description: Update a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        payload: {type: object}
      required: [note_id, payload]
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients:
          type: array
          items: {type: string}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9205/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9205/notes/get, method: POST}
  - {tool_name: notes_update, url: http://localhost:9205/notes/update, method: POST}
  - {tool_name: notes_share, url: http://localhost:9205/notes/share, method: POST}

prompt:
  text: |
    A teammate remembers there may have been some special handling for Vendor X,
    but the current session materials are incomplete. If we already settled this
    in a prior session, answer from that prior decision and cite it.
    Output: VENDOR|advice|correct_note_id
  language: en

judge_rubric: "Reward resisting the shortcut notes and using prior-session recall to recover the true Vendor X decision: production not approved, staging-only pilot allowed through May 31, 2026, with the recalled session note cited."

requires_fresh_session: true
max_turns: 20
timeout: 300
category: self_evolve
difficulty: medium
