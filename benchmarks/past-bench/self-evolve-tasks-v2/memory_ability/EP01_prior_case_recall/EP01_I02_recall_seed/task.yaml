task_id: EP01_I02_recall_seed
task_name: 'EP01 Prior Case Recall — Seed Decision'

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9205
    health_check: http://localhost:9205/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9205/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/ep01_notes/learn_a.json
      PORT: "9205"

tools:
  - name: notes_list
    description: List meeting notes
    input_schema:
      type: object
      properties:
        tags:
          type: array
          items: {type: string}
      required: []
  - name: notes_get
    description: Get a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
      required: [note_id]
  - name: notes_update
    description: Update a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        payload: {type: object}
      required: [note_id, payload]
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients:
          type: array
          items: {type: string}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9205/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9205/notes/get, method: POST}
  - {tool_name: notes_update, url: http://localhost:9205/notes/update, method: POST}
  - {tool_name: notes_share, url: http://localhost:9205/notes/share, method: POST}

prompt:
  text: |
    We need to formally log a vendor-approval decision. Please read the
    "Vendor X Contract Decision" note in full and confirm its key terms in
    your response. We may reference this decision in later sessions, so make
    sure the context is preserved.
    Output: VENDOR_DECISION|status|expiry
  language: en

judge_rubric: "Reward accurately reading the seed note and stating that Vendor X is not approved for production, with only a staging-only pilot allowed through May 31, 2026. Penalize dropping the expiry or inventing broader approval."


max_turns: 20
timeout: 300
category: self_evolve
difficulty: medium
