task_id: EP01_I06_control_no_persistence
task_name: 'EP01 Prior Case Recall — Control No Persistence'

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9205
    health_check: http://localhost:9205/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9205/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/ep01_notes/control_no_persistence.json
      PORT: "9205"

tools:
  - name: notes_list
    description: List meeting notes
    input_schema:
      type: object
      properties:
        tags:
          type: array
          items: {type: string}
      required: []
  - name: notes_get
    description: Get a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
      required: [note_id]
  - name: notes_update
    description: Update a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        payload: {type: object}
      required: [note_id, payload]
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients:
          type: array
          items: {type: string}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9205/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9205/notes/get, method: POST}
  - {tool_name: notes_update, url: http://localhost:9205/notes/update, method: POST}
  - {tool_name: notes_share, url: http://localhost:9205/notes/share, method: POST}

prompt:
  text: |
    Procurement needs a same-day answer on Vendor X for production rollout.
    Follow the prior decision if we already documented one, and cite the note
    rather than asking them to restate it.
    Output: VENDOR|advice|correct_note_id
  language: en

judge_rubric: "Use the same success standard as the evaluation tasks: reward recovering the prior Vendor X decision that production is not approved pending SOC2, with only a staging-only pilot allowed through May 31, 2026, and citing the prior decision note. This no-persistence control should score substantially lower when that prior-session decision is not recoverable. Do not award high scores for merely stating that no record is available."

requires_fresh_session: true
max_turns: 20
timeout: 300
category: self_evolve
difficulty: medium
