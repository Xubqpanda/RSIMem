task_id: EP01_I08_control_wrong_mechanism
task_name: 'EP01 Prior Case Recall — Control Wrong Mechanism'

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9205
    health_check: http://localhost:9205/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9205/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/ep01_notes/control_wrong_mechanism.json
      PORT: "9205"

tools:
  - name: notes_list
    description: List meeting notes
    input_schema:
      type: object
      properties:
        tags:
          type: array
          items: {type: string}
      required: []
  - name: notes_get
    description: Get a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
      required: [note_id]
  - name: notes_update
    description: Update a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        payload: {type: object}
      required: [note_id, payload]
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients:
          type: array
          items: {type: string}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9205/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9205/notes/get, method: POST}
  - {tool_name: notes_update, url: http://localhost:9205/notes/update, method: POST}
  - {tool_name: notes_share, url: http://localhost:9205/notes/share, method: POST}

prompt:
  text: |
    Legal found a generic vendor policy note, but they need to know whether
    Vendor X had any specific one-off decision or exception beyond the generic
    rule. Check prior work before answering.
    Output: VENDOR|advice|correct_note_id
  language: en

judge_rubric: "Reward citing the session-specific Vendor X one-off decision from prior-session recall, not just the generic SOC2 policy note. Penalize answers that rely only on the generic policy and miss the staging-only pilot exception through May 31, 2026."

requires_fresh_session: true
max_turns: 20
timeout: 300
category: self_evolve
difficulty: medium
