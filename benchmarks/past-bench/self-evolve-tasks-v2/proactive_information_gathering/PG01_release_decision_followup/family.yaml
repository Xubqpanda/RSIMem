latent_rule_id: pg01_release_decision_followup_v1
what_is_learned: Release decisions referenced through vague follow-ups still require explicit session retrieval for exact environment, expiry, and reference fields.
what_persists: A retrieval skill note about searching sessions before sharing release guidance.
what_counts_as_reuse: Later release follow-ups search sessions first, cite the exact reference, and share the right note without guessing from passive memory.
false_positive_pattern: The agent answers from generic memory preload or from a similar but stale release record without opening the exact prior session.
must_demonstrate:
  - session retrieval happens before the first share action
  - exact environment, expiry, and reference are recalled
  - stale or similar release records are rejected
