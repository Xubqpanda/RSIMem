task_id: PG01_UPDATE_001
task_name: PG01 Release Decision Followup Policy Update
category: self_evolve
difficulty: medium
requires_fresh_session: true
hermes_home_seed:
  memory_seed: ../_family_seed/memories
  skill_seed: ../_family_seed/skills
  session_seed: ../_family_seed/session_seed.json
prompt:
  text: 'Update your own retrieval policy / skill note for future release follow-ups.

    Write a general rule, not a case-specific memory. Do not include any exact product names, reference IDs, or dates from past cases.


    Your updated note should explicitly say all of the following ideas:

    - search session history first

    - verify the exact reference and exact expiry

    - do this before sharing release guidance

    - reject stale or superseded records


    Output: POLICY_UPDATED|release_followup_lookup

    '
  language: en
environment:
  timeout_seconds: 300
  max_turns: 20
judge_rubric: Reward a general retrieval policy update that encodes the release-followup lookup habit without storing case-specific details.
