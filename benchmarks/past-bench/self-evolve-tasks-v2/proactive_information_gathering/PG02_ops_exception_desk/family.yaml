what_is_learned: Mixed retrieval routing for durable policy, procedural desk workflow, and one-off exceptions.
what_persists: A retrieval skill note that says to open the desk procedure first and then search sessions for temporary exception IDs before updating tickets.
what_counts_as_reuse: Later probes consult the desk procedure and exception sessions instead of applying only the durable default.
false_positive_pattern: The agent treats temporary exceptions as durable policy, or updates tickets using only a remembered default without checking the exception log.
must_demonstrate:
  - skill retrieval is used for the desk workflow
  - session retrieval is used for exception lookup
  - expired or non-matching exceptions are not reused
