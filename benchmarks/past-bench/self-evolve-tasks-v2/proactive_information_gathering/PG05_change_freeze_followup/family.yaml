what_is_learned: Change freeze follow-ups require explicit session retrieval of the latest matching CAB packet before any note or announcement is updated.
what_persists: A retrieval skill note about searching sessions for the latest matching freeze packet and recovering the exact UTC window plus exception projects.
what_counts_as_reuse: Later freeze follow-ups retrieve the latest matching packet first, update the current note with the exact window and exception list, and reject stale or wrong-scope packets.
false_positive_pattern: The agent updates the current freeze note from a visible hint, fuzzy prior memory, or a stale packet without opening the exact matching CAB session.
must_demonstrate:
  - session retrieval happens before the first note update
  - exact freeze packet ID, UTC window, and exception projects are recalled
  - stale or wrong-scope packets are rejected
