task_id: PG04_ATTEMPT_001
task_name: PG04 Temporary Waiver Audit Attempt Probe
category: self_evolve
difficulty: medium
requires_fresh_session: true
hermes_home_seed:
  memory_seed: ../_family_seed/memories
  skill_seed: ../_family_seed/skills
  session_seed: ../_family_seed/session_seed.json
prompt:
  text: 'Audit whether a prior temporary waiver still applies to the current ledger-export request. Update AUDIT-PG04-A using this exact format only: WAIVER_AUDIT|approved=<comma-list-or-none>|rejected=<comma-list-or-none>|reference=<waiver-id-or-none>|expiry=<yyyy-mm-dd-or-none>.
    Output the same line.'
  language: en
environment:
  timeout_seconds: 300
  max_turns: 20
judge_rubric: Reward retrieving WAIV-118 before updating AUDIT-PG04-A, then approving only LGR-EU-14 and LGR-EU-19, rejecting LGR-EU-22, and citing 2026-05-10.
services:
- name: notes
  command: python mock_services/notes/server.py
  port: 9205
  health_check: http://localhost:9205/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9205/notes/reset
  env:
    NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/pg04_notes/attempt_probe_pre.json
    PORT: '9205'
tools:
- name: notes_list
  description: List meeting notes
  input_schema:
    type: object
    properties:
      tags:
        type: array
        items:
          type: string
      max_results:
        type: integer
    required: []
- name: notes_get
  description: Get a meeting note
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
- name: notes_update
  description: Update a meeting note
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      payload:
        type: object
    required:
    - note_id
    - payload
- name: notes_share
  description: Share a meeting note
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      recipients:
        type: array
        items:
          type: string
    required:
    - note_id
    - recipients
tool_endpoints:
- tool_name: notes_list
  url: http://localhost:9205/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9205/notes/get
  method: POST
- tool_name: notes_update
  url: http://localhost:9205/notes/update
  method: POST
- tool_name: notes_share
  url: http://localhost:9205/notes/share
  method: POST
