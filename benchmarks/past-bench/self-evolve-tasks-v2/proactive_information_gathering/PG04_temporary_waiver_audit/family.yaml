what_is_learned: Temporary waivers are only reusable when the exact owner/service/scope/expiry tuple matches.
what_persists: A retrieval skill note that says to search the exact waiver record and reject near matches.
what_counts_as_reuse: Later waiver audits explicitly retrieve the prior waiver, update the audit note with the exact approved set, and reject scope mismatches.
false_positive_pattern: The agent applies a temporary waiver to a near match, turning one-off approval into a generalized rule.
must_demonstrate:
  - the waiver record is explicitly retrieved before the audit note is updated
  - owner, service, scope, and expiry are matched exactly
  - near matches are rejected
