task_id: PG03_CONTROL_BOUNDARY_001
task_name: PG03 Oncall Handoff Lookup Control Boundary
category: self_evolve
difficulty: medium
requires_fresh_session: true
hermes_home_seed:
  memory_seed: ../_family_seed/memories
  skill_seed: ../_family_seed/skills
  session_seed: ../_family_seed/session_seed.json
prompt:
  text: 'Multiple CacheEdge follow-up tickets are open, including stale ones from an older handoff. Read your newly added handoff lookup skill first, then search session history for the latest matching
    handoff before any ticket update, and update only the currently blocked follow-up tickets. Output: HANDOFF|handoff_id|incident_id|owner|window|blocked_ticket_ids'
  language: en
environment:
  timeout_seconds: 300
  max_turns: 20
judge_rubric: Reward retrieving HAND-742 rather than HAND-701, then updating only HD-PG03-103 and HD-PG03-104 while leaving HD-PG03-101, HD-PG03-102, and INC-870 untouched.
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/pg03_helpdesk/control_boundary_latest_record.json
    PORT: '9107'
tools:
- name: helpdesk_list_tickets
  description: List helpdesk tickets
  input_schema:
    type: object
    properties:
      status:
        type: string
    required: []
- name: helpdesk_get_ticket
  description: Get helpdesk ticket details
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: Update a helpdesk ticket
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
      priority:
        type: string
      tags:
        type: array
        items:
          type: string
      category:
        type: string
      reason_code:
        type: string
    required:
    - ticket_id
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
