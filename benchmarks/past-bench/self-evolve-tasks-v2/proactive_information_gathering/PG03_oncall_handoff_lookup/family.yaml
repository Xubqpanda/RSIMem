latent_rule_id: pg03_oncall_handoff_lookup_v1
what_is_learned: Incident handoff tasks require explicit session retrieval of exact owner, window, ticket set, and blocked actions before any update.
what_persists: A retrieval skill note about searching handoff sessions first and preferring the latest matching handoff.
what_counts_as_reuse: Later probes update only the blocked child tickets after retrieving the latest handoff record and citing the exact owner/window.
false_positive_pattern: The agent acts from vague memory, updates the root incident, or reuses a stale handoff with the wrong owner or window.
must_demonstrate:
  - retrieval happens before the first ticket update
  - exact owner, window, and ticket set are recalled
  - stale handoffs are not reused when a newer one exists
