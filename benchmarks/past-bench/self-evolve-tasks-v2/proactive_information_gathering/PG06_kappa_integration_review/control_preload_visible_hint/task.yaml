task_id: PG06_CONTROL_PRELOAD_001
task_name: PG06 Kappa Integration Review Control Preload
category: self_evolve
difficulty: medium
requires_fresh_session: true
hermes_home_seed:
  memory_seed: ../_family_seed/memories
  skill_seed: ../_family_seed/skills
  session_seed: ../_family_seed/session_seed.json
prompt:
  text: 'The current Kappa panel still visibly mentions the old alias from a prior week, but the exact weekly exception IDs and current scoped routing are not restated here. Read the updated Kappa review
    workflow first, then recover the exact exception IDs and share only the notes that truly need escalation.

    Output each reviewed note as: NOTE_ID|decision|recipient|reason'
  language: en
environment:
  timeout_seconds: 300
  max_turns: 20
judge_rubric: Reward using both the workflow skill and session retrieval rather than the visible hint, then sharing INT-K601 only to security-partners@corp.com while leaving the exception note unshared.
services:
- name: notes
  command: python mock_services/notes/server.py
  port: 9205
  health_check: http://localhost:9205/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9205/notes/reset
  env:
    NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/pg06_notes/control_preload_visible_hint.json
    PORT: '9205'
tools:
- name: notes_list
  description: List integration review notes
  input_schema:
    type: object
    properties:
      tags:
        type: array
        items:
          type: string
      max_results:
        type: integer
    required: []
- name: notes_get
  description: Get an integration review note
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
- name: notes_share
  description: Share an integration review note
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      recipients:
        type: array
        items:
          type: string
    required:
    - note_id
    - recipients
tool_endpoints:
- tool_name: notes_list
  url: http://localhost:9205/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9205/notes/get
  method: POST
- tool_name: notes_share
  url: http://localhost:9205/notes/share
  method: POST
