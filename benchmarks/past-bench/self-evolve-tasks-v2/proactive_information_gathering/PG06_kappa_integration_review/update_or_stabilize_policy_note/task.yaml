prompt:
  text: 'Update your own retrieval policy / meta-memory / skill note for future Kappa integration reviews.

    Stable routing fact change:
    - customer-facing payment or identity Kappa integrations now escalate to security-partners@corp.com instead of infra-risk@corp.com
    - every other Kappa escalation still uses infra-risk@corp.com
    - workflow steps are unchanged
    - weekly exception IDs must still be recovered from session history

    Write a general rule, not a case-specific memory. Do not include any exact weekly exception IDs or note IDs.

    Output: POLICY_UPDATED|kappa_review_workflow

    '
  language: en
environment:
  timeout_seconds: 300
  max_turns: 20
judge_rubric: Reward a general policy update that patches the scoped routing fact while preserving the existing workflow and weekly-exception retrieval rule.
