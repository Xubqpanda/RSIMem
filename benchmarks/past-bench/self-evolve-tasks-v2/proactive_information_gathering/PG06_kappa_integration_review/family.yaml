what_is_learned: Kappa integration review requires mixed retrieval across a durable routing fact, a reusable workflow, and weekly exception IDs that remain session-only.
what_persists: A workflow note about reading the Kappa review skill first, using durable routing rules carefully, and retrieving weekly exception IDs from session history.
what_counts_as_reuse: Later probes reuse the workflow, keep one-off exceptions session-bound, and apply the patched alias only to the updated scope while preserving the rest.
false_positive_pattern: The agent reuses an old alias everywhere, bakes weekly exception IDs into durable policy, or generalizes a one-off shortcut to superficially similar notes.
must_demonstrate:
  - skill retrieval is used for the Kappa review workflow
  - session retrieval is used for weekly exception lookup
  - scope-specific alias updates preserve unchanged routing and do not generalize one-off shortcuts
