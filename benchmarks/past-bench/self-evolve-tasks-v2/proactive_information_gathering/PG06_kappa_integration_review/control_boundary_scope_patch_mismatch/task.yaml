task_id: PG06_CONTROL_BOUNDARY_001
task_name: PG06 Kappa Integration Review Control Boundary
category: self_evolve
difficulty: medium
requires_fresh_session: true
prompt:
  text: 'A fresh session starts from an intentionally messy persisted state. Even so, read the updated Kappa review workflow first, then combine it with the exact current weekly exception recall and the
    scoped alias rules. Share only the notes that truly need escalation.

    Output each reviewed note as: NOTE_ID|decision|recipient|reason'
  language: en
environment:
  timeout_seconds: 300
  max_turns: 20
judge_rubric: Reward ignoring the intentionally wrong carriers, then sharing INT-K701 to security-partners@corp.com and INT-K702 to infra-risk@corp.com while leaving INT-K207 unshared.
services:
- name: notes
  command: python mock_services/notes/server.py
  port: 9205
  health_check: http://localhost:9205/notes/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9205/notes/reset
  env:
    NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/pg06_notes/control_boundary_scope_patch_mismatch.json
    PORT: '9205'
tools:
- name: notes_list
  description: List integration review notes
  input_schema:
    type: object
    properties:
      tags:
        type: array
        items:
          type: string
      max_results:
        type: integer
    required: []
- name: notes_get
  description: Get an integration review note
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
- name: notes_share
  description: Share an integration review note
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      recipients:
        type: array
        items:
          type: string
    required:
    - note_id
    - recipients
tool_endpoints:
- tool_name: notes_list
  url: http://localhost:9205/notes/list
  method: POST
- tool_name: notes_get
  url: http://localhost:9205/notes/get
  method: POST
- tool_name: notes_share
  url: http://localhost:9205/notes/share
  method: POST
