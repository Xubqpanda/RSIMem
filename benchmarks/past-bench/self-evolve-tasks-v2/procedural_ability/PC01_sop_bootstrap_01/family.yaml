# §4 Semantic Metadata
what_is_learned: >
  Shared Incident SOP — the step-by-step procedure for identifying
  same-cluster incident tickets, tagging them, and leaving resolution to on-call.
what_persists: >
  A durable skill artifact encoding the full triage SOP so it can be applied
  without re-reading the KB article.
what_counts_as_reuse: >
  Agent applies the persisted SOP steps to novel shared-incident tickets with changed
  entities, without access to the original KB text.
false_positive_pattern: >
  Agent copies surface wording from the KB article verbatim instead of
  extracting a generalized procedure; passes near-transfer but fails far.
must_demonstrate:
- Extract a reusable triage procedure from KB exposure
- Apply the SOP to tickets with novel entities and surface variation
- Maintain correct step ordering and decision logic across sessions

# §13.0 Trigger Spec
trigger_category: direct_explicit_instruction
trigger_strength: T3
visibility_surface: direct user/system message with durable Shared Incident SOP
trigger_injection_plan: learn_a delivers explicit Shared Incident SOP in prompt; update_or_stabilize reinforces with surface-varied tickets
trigger_removal_plan: eval removes SOP text; only novel tickets remain
trigger_mixing_rule: no repeated_cases_induction; direct teaching only
sibling_comparison_plan: compare with PC03 induction families for trigger-strength analysis
phase1_canonical_sibling: this is a T3 canonical anchor
future_sibling_roadmap: T2 durable-rule wording; T1 embedded-note version

# §10 Cold Design
cold_design: same-workflow task before any SOP or KB is introduced
expected_cold_result: partial solve without stable reusable procedure

# Control Design
control_design: no_persistence, shortcut, surface_memorization
expected_control_result: transfer gain shrinks without persisted procedure; template reuse alone should not pass

