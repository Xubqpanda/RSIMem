task_id: V2_FM02_C02
task_name: FM02 Control — Shortcut (SOP in Prompt)
version: '1.0'
category: self_evolve
difficulty: hard
control_type: shortcut
environment:
  timeout_seconds: 300
  max_turns: 25
requires_fresh_session: true
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fm02_v2_helpdesk/cold.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fm02_v2_kb/brief.json
prompt:
  text: "First, call helpdesk_list_tickets to retrieve all open tickets. Then call\
    \ helpdesk_get_ticket for each ticket to read its details. You MUST use these tools\
    \ — do NOT guess or assume ticket IDs or contents.\n\nAfter reading each ticket,\
    \ apply the following SOP to decide which tickets to update:\n\n## Shared Outage\
    \ Triage SOP v2\n\nTrigger: three or more tickets from distinct reporters all reference\
    \ the same failing infrastructure zone within a 4-hour window.\n\nSteps:\n1. Read\
    \ all open tickets and identify the infrastructure zone mentioned.\n2. If 3+ distinct\
    \ reporters cite the same zone, classify as shared outage.\n3. Tag each shared-outage\
    \ ticket with: zone-correlated, shared-outage-confirmed\n4. Set priority=critical\
    \ and category=outage-investigation on all shared-outage tickets.\n5. Do NOT close\
    \ any ticket — leave resolution to on-call SRE team.\n\nExclusions:\n- Maintenance\
    \ requests, feature requests, and performance tuning tickets are NOT outages.\n\
    - A single-reporter ticket citing the same zone does NOT qualify unless there are\
    \ 3+ distinct reporters.\n- Config review and hardware upgrade tickets are NOT outages.\n\
    \nFor each ticket that matches the SOP, call helpdesk_update_ticket to update it.\n\
    Output: TICKET_ID|priority|category|why\n"
  language: en
tools:
- name: helpdesk_list_tickets
  description: List helpdesk tickets
  input_schema:
    type: object
    properties:
      status:
        type: string
    required: []
- name: helpdesk_get_ticket
  description: Get ticket details
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: Update a ticket
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
      priority:
        type: string
      tags:
        type: array
        items:
          type: string
      category:
        type: string
      status:
        type: string
      internal_note:
        type: string
    required:
    - ticket_id
- name: kb_search
  description: Search the knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
judge_rubric: 'Control (shortcut): The full Shared Outage Triage SOP v2 is embedded
  directly in the prompt, bypassing any need for skill retrieval. If this scores high,
  the task is solvable from prompt context alone — proves the eval is not trivially
  easy only when persistence is available. Reward correct triage of TK-FM02-N01, N02,
  N03 with zone-correlated + shared-outage-confirmed + priority=critical + category=outage-investigation.

  '
