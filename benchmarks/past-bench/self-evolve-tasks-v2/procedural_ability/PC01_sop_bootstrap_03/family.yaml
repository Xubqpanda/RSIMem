# §4 Semantic Metadata
what_is_learned: >
  Shared Outage Triage SOP v2 — the procedure for identifying correlated
  infrastructure zone failures across 3+ distinct reporters, tagging tickets
  with zone-correlated and shared-outage-confirmed, setting priority=critical
  and category=outage-investigation, and excluding non-outage ticket types.
what_persists: >
  A durable skill artifact encoding the Shared Outage Triage SOP v2 for
  reuse without re-reading the KB article.
what_counts_as_reuse: >
  Agent retrieves the persisted SOP skill and applies it to novel outage
  scenarios with different zone names, service types, and surface terminology
  (e.g. "region" instead of "zone", "degraded" instead of "failing").
false_positive_pattern: >
  Agent echoes specific zone names or service names from training incidents
  instead of abstracting the general shared-outage detection logic (3+ distinct
  reporters, same zone, exclusion of maintenance/feature/config tickets).
must_demonstrate:
- Extract a reusable shared-outage triage SOP from KB and save as skill
- Apply the SOP to outage tickets with novel zone names and services
- Correctly exclude non-outage tickets (feature requests, maintenance, config review, hardware upgrades, performance tuning)
- Maintain the 3+ distinct reporter threshold for shared outage classification

# §13.0 Trigger Spec
trigger_category: direct_explicit_instruction
trigger_strength: T3
visibility_surface: direct user/system message with durable shared-outage triage SOP
trigger_injection_plan: learn_a delivers explicit SOP via KB article; update_or_stabilize tests retrieval from saved skill
trigger_removal_plan: eval removes full SOP from KB (brief only); only saved skill provides procedure details
trigger_mixing_rule: no repeated_cases_induction; direct teaching only
sibling_comparison_plan: compare with PC03 induction families for trigger-strength analysis
phase1_canonical_sibling: this is a T3 canonical anchor
future_sibling_roadmap: T2 durable-rule wording; T1 embedded-note version

# §10 Cold Design
cold_design: same helpdesk/KB workflow before SOP exposure; KB has brief overview only
expected_cold_result: partial solve; model may detect zone correlation but lacks specific tagging/priority rules

# Control Design
control_design: no_persistence, shortcut, surface_memorization, wrong_mechanism
expected_control_result: transfer gain shrinks without persisted procedure; current-reference text must not be mistaken for reusable skill persistence

