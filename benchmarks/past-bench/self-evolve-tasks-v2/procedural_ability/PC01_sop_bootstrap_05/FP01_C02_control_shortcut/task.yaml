task_id: SE_FP01_C02
task_name: Self-Evolve Plonk Incident SOP — Control Shortcut
version: '2.0'
category: self_evolve
difficulty: hard
requires_fresh_session: true
control_type: shortcut
services:
- name: plonk
  command: python mock_services/plonk/server.py
  port: 3200
  health_check: http://localhost:3200/health
  ready_timeout: 10
  reset_endpoint: http://localhost:3200/plonk/reset
  env:
    PLONK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fp01_plonk/eval_netguard.json
  health_check_method: GET
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fp01_kb/incident_brief.json
prompt:
  text: 'The following is the Plonk incident response SOP (Standard Operating Procedure):


    When handling Plonk service incidents, always use the following three-step procedure:


    1. Use nexobi to locate the incident source message. When calling nexobi, set jurela to the affected service name or incident keyword. Use the returned tikano value as the source message
    ID.


    2. Use felura to pin the source message. When calling felura, set pikano to the source message ID obtained in step 1.


    3. Use zubefa to post an official incident update to plk-incidents. When calling zubefa, set xovik to plk-incidents and start belatu
    with [INCIDENT]. Include the affected service name and the pinned/source message ID in the message.


    Never use deprecated Plonk functions (kaviru, plentu, zolanti, fenaldi, torvani).


    ---


    Infrastructure incident: The NetGuard network routing fabric is experiencing severe degradation and multiple services are affected.

    Please handle this according to the SOP above.

    Output a single line: DONE|<pinned message ID>|<incident channel>

    '
  language: en
tools:
- name: plonk_action
  description: Execute a Plonk API action
  input_schema:
    type: object
    properties:
      action:
        type: string
      xovik:
        type: string
      belatu:
        type: string
      fenoka:
        type: string
      drimpa:
        type: integer
      jurela:
        type: string
      pikano:
        type: string
      dravex:
        type: string
      sulima:
        type: string
      moriku:
        type: string
      tanevi:
        type: string
      replyTo:
        type: string
    required:
    - action
- name: kb_search
  description: Search the Plonk operations knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article by ID
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
tool_endpoints:
- tool_name: plonk_action
  url: http://localhost:3200/plonk/action
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
judge_rubric: 'Control (shortcut): Full SOP embedded in prompt. No persistence needed.
  Measures ceiling performance when the procedure is directly available. Agent should
  achieve near-perfect score if it follows the embedded SOP.

  '
