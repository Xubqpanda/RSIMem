task_id: SE_FP01_I02
task_name: Self-Evolve Plonk Incident SOP — AuthWall Learn A
version: '2.0'
category: self_evolve
difficulty: hard
services:
- name: plonk
  command: python mock_services/plonk/server.py
  port: 3200
  health_check: http://localhost:3200/health
  ready_timeout: 10
  reset_endpoint: http://localhost:3200/plonk/reset
  env:
    PLONK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fp01_plonk/learn_authwall.json
  health_check_method: GET
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fp01_kb/incident_sop_full.json
prompt:
  text: 'Please first consult the Plonk incident response procedure (KB-PLK-001) in the knowledge base. After reading it carefully, save the SOP as a reusable skill so it can be used directly when handling similar incidents in the future.


    The AuthWall login service is experiencing a failure and users are unable to authenticate.

    Please handle this according to the incident response procedure.

    Output a single line: DONE|<pinned message ID>|<incident channel>

    '
  language: en
tools:
- name: plonk_action
  description: Execute a Plonk API action
  input_schema:
    type: object
    properties:
      action:
        type: string
      xovik:
        type: string
      belatu:
        type: string
      fenoka:
        type: string
      drimpa:
        type: integer
      jurela:
        type: string
      pikano:
        type: string
      dravex:
        type: string
      sulima:
        type: string
      moriku:
        type: string
      tanevi:
        type: string
      replyTo:
        type: string
    required:
    - action
- name: kb_search
  description: Search the Plonk operations knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article by ID
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
tool_endpoints:
- tool_name: plonk_action
  url: http://localhost:3200/plonk/action
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
judge_rubric: 'Award full credit if the agent: (1) reads KB-PLK-001 and extracts the
  three-step SOP, (2) applies nexobi → felura → zubefa to plk-incidents with [INCIDENT]
  prefix, and (3) never calls any deprecated function. Reflection credit for agents
  that write a skill capturing the SOP from KB-PLK-001. Zero credit if kaviru, plentu,
  torvani, zolanti, or any deprecated function is called.

  '
