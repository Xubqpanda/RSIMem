task_id: SE_FP01_I03B
task_name: Self-Evolve Plonk Incident SOP — StreamFlow Eval Far
version: '2.0'
category: self_evolve
difficulty: hard
requires_fresh_session: true
services:
- name: plonk
  command: python mock_services/plonk/server.py
  port: 3200
  health_check: http://localhost:3200/health
  ready_timeout: 10
  reset_endpoint: http://localhost:3200/plonk/reset
  env:
    PLONK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fp01_plonk/eval_streamflow.json
  health_check_method: GET
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fp01_kb/incident_brief.json
prompt:
  text: 'If you have previously saved a skill for the Plonk incident response procedure, please retrieve and use it first.


    Data pipeline incident: The StreamFlow real-time ingestion pipeline has stopped, consumer lag is growing continuously, and multiple dashboards are showing stale data.

    Handle this incident.

    Output a single line: DONE|<pinned message ID>|<incident channel>

    '
  language: en
tools:
- name: plonk_action
  description: Execute a Plonk API action
  input_schema:
    type: object
    properties:
      action:
        type: string
      xovik:
        type: string
      belatu:
        type: string
      fenoka:
        type: string
      drimpa:
        type: integer
      jurela:
        type: string
      pikano:
        type: string
      dravex:
        type: string
      sulima:
        type: string
      moriku:
        type: string
      tanevi:
        type: string
      replyTo:
        type: string
    required:
    - action
- name: kb_search
  description: Search the Plonk operations knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article by ID
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
tool_endpoints:
- tool_name: plonk_action
  url: http://localhost:3200/plonk/action
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
judge_rubric: 'Award full credit if the agent applies the full SOP without any prompt
  hint. Far-transfer evaluation — distractor channels present, pipeline domain differs
  from prior episodes. No SOP reference in prompt; agent must use the persisted skill
  autonomously. Zero credit for any deprecated function call or failure to post to
  plk-incidents.

  '
