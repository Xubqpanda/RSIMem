# §4 Semantic Metadata
what_is_learned: >
  Plonk Incident Response SOP — the three-step procedure for locating an
  incident source message with nexobi, pinning it with felura, and publishing
  the official incident update with zubefa.
what_persists: >
  A durable skill artifact encoding the Plonk Incident Response SOP for reuse across
  sessions without re-reading the KB article.
what_counts_as_reuse: >
  Agent applies the persisted Plonk incident-response SOP to novel incidents
  with different services, source messages, and update wording.
false_positive_pattern: >
  Agent memorizes specific services or source messages from training cases instead
  of extracting the general nexobi -> felura -> zubefa procedure.
must_demonstrate:
- Extract a reusable Plonk incident-response procedure from explicit SOP delivery
- Apply the procedure to novel Plonk incidents with changed entities
- Preserve correct nexobi, felura, and zubefa sequencing

# §13.0 Trigger Spec
trigger_category: direct_explicit_instruction
trigger_strength: T3
visibility_surface: direct user/system message with durable Plonk Incident Response SOP
trigger_injection_plan: learn_a delivers explicit Plonk Incident Response SOP in prompt; update_or_stabilize reinforces with surface-varied cases
trigger_removal_plan: eval removes SOP text; only novel Plonk incidents remain
trigger_mixing_rule: no repeated_cases_induction; direct teaching only
sibling_comparison_plan: compare with PC03 induction families for trigger-strength analysis
phase1_canonical_sibling: this is a T3 canonical anchor
future_sibling_roadmap: T2 durable-rule wording; T1 embedded-note version

# §10 Cold Design
cold_design: same plonk workflow before any SOP or KB exposure
expected_cold_result: partial solve; no stable reusable procedure

# Control Design
