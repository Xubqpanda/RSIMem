task_id: V2_FP01_C04
task_name: Procedural Control - Wrong Mechanism
version: '2.0'
category: self_evolve
difficulty: hard
requires_fresh_session: true
control_type: wrong_mechanism
persistence_disabled: true
services:
- name: plonk
  command: python mock_services/plonk/server.py
  port: 3200
  health_check: http://localhost:3200/health
  ready_timeout: 10
  reset_endpoint: http://localhost:3200/plonk/reset
  env:
    PLONK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fp01_plonk/eval_netguard.json
  health_check_method: GET
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fp01_kb/incident_sop_full.json
prompt:
  text: |
    Read the current Plonk knowledge-base article and apply the incident-response
    procedure it describes to the current incident. The procedure is deliberately
    available as plain current reference text, not as a reusable skill artifact.
    Do not create or read a skill artifact for this control. Complete the Plonk
    actions and output: DONE|<pinned message ID>|<incident channel>

    Use kb_search and kb_get_article before using plonk_action.
  language: en
tools:
- name: plonk_action
  description: Execute a Plonk API action
  input_schema:
    type: object
    properties:
      action:
        type: string
      xovik:
        type: string
      belatu:
        type: string
      fenoka:
        type: string
      drimpa:
        type: integer
      jurela:
        type: string
      pikano:
        type: string
      dravex:
        type: string
      sulima:
        type: string
      moriku:
        type: string
      tanevi:
        type: string
      replyTo:
        type: string
    required:
    - action
- name: kb_search
  description: Search the Plonk operations knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article by ID
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
tool_endpoints:
- tool_name: plonk_action
  url: http://localhost:3200/plonk/action
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 20
judge_rubric: 'Control (surface_memorization): Only surface keywords provided (nexobi,
  felura, zubefa, plk-incidents). No procedure structure or parameter details. Tests
  whether keyword exposure alone enables correct execution. Success here is a false
  positive — it means the task can be solved from keyword hints alone.

  '
