task_id: V2_F07_C01
task_name: F07 Control — Reflection Off
category: self_evolve
difficulty: hard
control_type: reflection_off
requires_fresh_session: true
persistence_disabled: true
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9200
  health_check: http://localhost:9200/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9200/helpdesk/reset
  env:
    HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f07_helpdesk/eval_near.json
    PORT: '9200'
- name: kb
  command: python mock_services/kb/server.py
  port: 9201
  health_check: http://localhost:9201/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9201/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f07_kb/brief.json
    PORT: '9201'
prompt:
  text: 'Apply deployment rollback grouping rules to these tickets. The KB has a brief

    overview only. Group child tickets by deployment event and update them with

    appropriate tags, priority, and category. Do NOT close any ticket.


    Output one line per updated ticket: TICKET_ID|priority|category|tags

    You MUST use helpdesk_list_tickets, helpdesk_get_ticket, and helpdesk_update_ticket
    tools to process and update tickets.

    '
  language: en
tools:
- name: helpdesk_list_tickets
  description: List all open helpdesk tickets.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: Filter by ticket status (e.g., open, closed).
    required: []
- name: helpdesk_get_ticket
  description: Get details of a specific helpdesk ticket.
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: The ticket ID to retrieve.
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: Update a helpdesk ticket with new priority, category, status, or tags.
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
        description: The ticket ID to update.
      priority:
        type: string
        description: New priority value.
      category:
        type: string
        description: New category value.
      status:
        type: string
        description: New status value.
      tags:
        type: array
        items:
          type: string
        description: Tags to apply to the ticket.
    required:
    - ticket_id
- name: kb_search
  description: Search the knowledge base for articles matching a query.
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: Search query string.
    required:
    - query
- name: kb_get_article
  description: Retrieve a specific knowledge base article by ID.
  input_schema:
    type: object
    properties:
      article_id:
        type: string
        description: The article ID to retrieve.
    required:
    - article_id
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9200/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9200/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9200/helpdesk/tickets/update
  method: POST
- tool_name: kb_search
  url: http://localhost:9201/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9201/kb/articles/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 25
judge_rubric: 'Control (reflection_off) — same eval_near task but persistence disabled,
  skipping the reflection episode effect. Agent has brief KB only, no skill library.
  If gain disappears vs eval_near, reflection was the real driver. Score using same
  criteria: TK-U402/U403 (hash=pqr678) should get priority=high, category=incident,
  tags=[deploy-child, root-event-pending]. Exclude TK-U401/U404/U405.'
