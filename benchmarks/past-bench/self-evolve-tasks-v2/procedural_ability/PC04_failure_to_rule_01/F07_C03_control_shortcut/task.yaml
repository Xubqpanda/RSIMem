task_id: V2_F07_C03
task_name: "F07 Control — Shortcut (SOP in Prompt)"
category: self_evolve
difficulty: hard
control_type: shortcut

requires_fresh_session: true

services:
  - name: helpdesk
    command: python mock_services/helpdesk/server.py
    port: 9200
    health_check: http://localhost:9200/helpdesk/tickets
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9200/helpdesk/reset
    env:
      HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f07_helpdesk/baseline.json
      PORT: "9200"
  - name: kb
    command: python mock_services/kb/server.py
    port: 9201
    health_check: http://localhost:9201/kb/search
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9201/kb/reset
    env:
      KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f07_kb/brief.json
      PORT: "9201"

prompt:
  text: "First, call helpdesk_list_tickets to retrieve all open tickets. Then call\
    \ helpdesk_get_ticket for each ticket to read its full details. You MUST use these\
    \ tools — do NOT guess or assume ticket IDs or contents.\n\nAfter reading each\
    \ ticket, apply the following SOP:\n\n## Deployment Rollback Grouping SOP\n\n1.\
    \ IDENTIFY CHILD TICKETS: Look for the root deployment ticket (ticket_type: deploy-event)\
    \ which carries the release_hash. Identify all child failure tickets that explicitly\
    \ reference the same release_hash in their description. Do NOT match tickets by\
    \ service name alone — only by release_hash.\n\n2. UPDATE CHILD TICKETS: For each\
    \ confirmed child ticket (matching release_hash): call helpdesk_update_ticket to\
    \ set priority=high, category=incident, tags=[deploy-child, root-event-pending].\
    \ Do NOT close any ticket. Do NOT update the root deployment ticket — only update\
    \ child failure tickets.\n\n3. EXCLUSIONS: Do NOT update tickets from unrelated\
    \ deployments (different release_hash). Matching by service name alone is INSUFFICIENT.\n\
    \nAfter updating all tickets, output: TICKET_ID|priority|category|tags\n"
  language: en

tools:
  - name: helpdesk_list_tickets
    description: List all open helpdesk tickets.
    input_schema:
      type: object
      properties:
        status:
          type: string
      required: []
  - name: helpdesk_get_ticket
    description: Get details of a specific helpdesk ticket.
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
      required:
        - ticket_id
  - name: helpdesk_update_ticket
    description: Update a helpdesk ticket with new priority, category, status, or tags.
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
        priority:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
        - ticket_id
  - name: kb_search
    description: Search the knowledge base for articles matching a query.
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
        - query
  - name: kb_get_article
    description: Retrieve a specific knowledge base article by ID.
    input_schema:
      type: object
      properties:
        article_id:
          type: string
      required:
        - article_id

tool_endpoints:
  - tool_name: helpdesk_list_tickets
    url: http://localhost:9200/helpdesk/tickets
    method: POST
  - tool_name: helpdesk_get_ticket
    url: http://localhost:9200/helpdesk/tickets/get
    method: POST
  - tool_name: helpdesk_update_ticket
    url: http://localhost:9200/helpdesk/tickets/update
    method: POST
  - tool_name: kb_search
    url: http://localhost:9201/kb/search
    method: POST
  - tool_name: kb_get_article
    url: http://localhost:9201/kb/articles/get
    method: POST

environment:
  timeout_seconds: 300
  max_turns: 25

judge_rubric: "Control (shortcut) — full Deployment Rollback SOP embedded in prompt. Reward tagging TK-R102 and TK-R103 as deploy-child (release_hash=abc123) with priority=high, category=incident, tags=[deploy-child, root-event-pending]. Penalize updating TK-R101 (root) or TK-R104 (different hash). Do NOT close any ticket."
