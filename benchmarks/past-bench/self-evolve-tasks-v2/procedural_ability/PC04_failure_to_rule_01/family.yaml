# §4 Semantic Metadata
what_is_learned: >
  Deployment rollback grouping rule — the principle that rollbacks should be
  grouped by release_hash, not by timestamp or service name.
what_persists: >
  A durable skill artifact encoding the release_hash grouping rule for
  rollback decisions, extracted from failure reflection.
what_counts_as_reuse: >
  Agent groups rollbacks by release_hash in novel deployment scenarios without
  being reminded of the rule or re-experiencing the failure.
false_positive_pattern: >
  Agent groups by release_hash only when surface cues resemble the original
  failure scenario; reverts to timestamp grouping under novel framing.
must_demonstrate:
- Extract the release_hash grouping rule from failure reflection
- Apply the rule to novel deployment rollback scenarios
- Resist reverting to naive grouping strategies under changed surface features

# §13.0 Trigger Spec
trigger_category: failure_reflection
trigger_strength: T0
visibility_surface: failure exposure + explicit reflection prompt
trigger_injection_plan: "attempt: expose failure mode; reflection: dedicated reflection episode; confirmation: verify reflection converted into behavior"
trigger_removal_plan: eval does not restate reflection text or extracted rule
trigger_mixing_rule: no explicit post-reflection teaching; reflection-driven learning only
sibling_comparison_plan: PC04B_failure_to_rule_by_correction if research question is reflection vs. direct correction
phase1_canonical_sibling: native reflection-driven form; not first trigger-strength comparison anchor
future_sibling_roadmap: compare reflection against direct correction and direct teaching siblings

# §10 Cold Design
cold_design: same-structure task without any reflection opportunity
expected_cold_result: weak procedure fails or remains unstable; no reusable post-failure rule

# Control Design
control_design: reflection_off and no_persistence controls
expected_control_result: if reflection is the real driver, gains weaken sharply when reflection path is disabled

