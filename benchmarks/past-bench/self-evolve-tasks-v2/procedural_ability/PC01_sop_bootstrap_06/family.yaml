# §4 Semantic Metadata
what_is_learned: >
  X engagement protocol — the procedure for evaluating engagement opportunities,
  selecting response strategies, and applying platform-specific interaction rules.
what_persists: >
  A durable skill artifact encoding the X engagement protocol for reuse across
  sessions without re-reading the protocol document.
what_counts_as_reuse: >
  Agent applies the persisted engagement protocol to novel X interaction
  scenarios with different topics, audiences, and platform contexts.
false_positive_pattern: >
  Agent copies specific phrasing or topic references from training interactions
  rather than extracting the general engagement decision framework.
must_demonstrate:
- Extract a reusable engagement protocol from explicit instruction delivery
- Apply the protocol to novel X scenarios with changed topics and audiences
- Maintain correct strategy selection and platform-rule compliance

# §13.0 Trigger Spec
trigger_category: passive_document_exposure
trigger_strength: T0
visibility_surface: protocol appears only as an operational KB/onboarding reference; the prompt does not frame it as durable knowledge
trigger_injection_plan: "learn_a: agent may read KB-X-001 while doing the task, but receives no save/future-use instruction; update_or_stabilize: brief-only policy reference with new posts"
trigger_removal_plan: eval removes protocol text; only task request remains
trigger_mixing_rule: no direct save-skill instruction and no future-use hint; success requires autonomous procedural abstraction from passive exposure
sibling_comparison_plan: compare with PC01_01..03 induction siblings for trigger-strength analysis
phase1_canonical_sibling: weakest-trigger PC01 sibling for trigger-strength analysis
future_sibling_roadmap: T1 embedded-note sibling with explicit policy label but no future-use wording

# §10 Cold Design
cold_design: same X engagement task before protocol is introduced
expected_cold_result: partial solve; no stable reusable procedure

# Control Design
control_design: no_persistence, shortcut, surface_memorization, wrong_mechanism
expected_control_result: transfer gain shrinks without persisted procedure; current-reference text must not be mistaken for reusable skill persistence

