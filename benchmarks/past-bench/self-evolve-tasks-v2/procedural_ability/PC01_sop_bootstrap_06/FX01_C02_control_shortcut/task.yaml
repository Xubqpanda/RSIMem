task_id: SE_FX01_C02
task_name: Self-Evolve X Engagement Protocol — Control Shortcut
version: '1.0'
category: self_evolve
difficulty: hard
requires_fresh_session: true
control_type: shortcut
services:
- name: x_mock
  command: python mock_services/x/server.py
  port: 3300
  health_check: http://localhost:3300/health
  ready_timeout: 10
  reset_endpoint: http://localhost:3300/x/reset
  env:
    X_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fx01_x/cold.json
  health_check_method: GET
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fx01_x/kb_cold.json
prompt:
  text: 'Here is the X (Twitter) Engagement Protocol you must follow:


    IMPORTANT — TOOL DISPATCH PATTERN: All X operations are issued through a single tool named `x_action`. The verb (replyToTweet / likeTweet / sendDM / quoteTweet / retweetTweet / getMentions / getTimeline / getTweet / getUserProfile / postTweet) is the value of the `action` field in the tool input — it is NOT a separate tool. Examples:

      - To reply publicly: call `x_action` with `{"action": "replyToTweet", "tweetId": "<id>", "text": "<reply text>"}`.
      - To like: call `x_action` with `{"action": "likeTweet", "tweetId": "<id>"}`.
      - To DM: call `x_action` with `{"action": "sendDM", "recipientId": "<user id>", "text": "<DM text>"}`.
      - To quote-tweet: call `x_action` with `{"action": "quoteTweet", "tweetId": "<id>", "text": "<quote text>"}`.
      - To fetch a profile: call `x_action` with `{"action": "getUserProfile", "username": "<handle>"}` (or `userId`).


    1. POSITIVE MENTION, HIGH-REACH (account with 1000+ followers): Reply publicly. Call `x_action` with `{"action": "replyToTweet", "tweetId": "<mention id>", "text": "Thanks @[username]! [short acknowledgment]. #CorpX"}`. Must include the #CorpX hashtag.


    2. POSITIVE MENTION, LOW-REACH (account with fewer than 1000 followers): Like the tweet only. Call `x_action` with `{"action": "likeTweet", "tweetId": "<mention id>"}`. Do NOT reply publicly to low-reach accounts.


    3. NEGATIVE MENTION (complaint, criticism, or negative sentiment about the company): Send a DM. Call `x_action` with `{"action": "sendDM", "recipientId": "<user id>", "text": "Hi @[username], sorry to hear this. [support message]"}`. NEVER reply publicly to a negative mention.


    4. VERIFIED EXPERT relevant post (post from a verified expert account discussing a topic relevant to company products): Quote-tweet. Call `x_action` with `{"action": "quoteTweet", "tweetId": "<post id>", "text": "<company perspective or relevant insight>"}`.


    5. COMPETITOR-TAGGED post (post that mentions or tags a competitor alongside the company): Ignore entirely — do NOT like, reply, retweet, or DM.


    Follower thresholds are based on the followers count in the user profile. Check user profile (`x_action` with `{"action": "getUserProfile", "username": "<handle>"}`) before deciding action type.


    ---


    You are the social media agent for @corp_x. Review the latest mentions and timeline,

    then apply the above protocol to each post.


    Use `x_action` with `{"action": "getMentions"}`, `{"action": "getTimeline"}`, and `{"action": "getUserProfile", ...}` as needed.

    '
  language: en
tools:
- name: x_action
  description: Execute an X (Twitter) action
  input_schema:
    type: object
    properties:
      action:
        type: string
        enum:
        - getTimeline
        - getMentions
        - getTweet
        - replyToTweet
        - postTweet
        - quoteTweet
        - sendDM
        - likeTweet
        - retweetTweet
        - getUserProfile
      tweetId:
        type: string
        description: Tweet ID for tweet-specific actions
      text:
        type: string
        description: Text content for postTweet, replyToTweet, quoteTweet
      recipientId:
        type: string
        description: User ID for sendDM
      username:
        type: string
        description: Username for getUserProfile
      userId:
        type: string
        description: User ID for getUserProfile
      count:
        type: integer
        description: Number of results to return
    required:
    - action
- name: kb_search
  description: Search the knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article by ID
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
tool_endpoints:
- tool_name: x_action
  url: http://localhost:3300/x/action
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 25
judge_rubric: 'Control (shortcut): Full engagement protocol embedded in prompt. No
  persistence needed. Measures ceiling performance when the protocol is directly available.
  Agent should achieve near-perfect score if it follows the embedded protocol.

  '
