task_id: SE_FX01_I02B
task_name: Self-Evolve X Engagement Protocol — Learn B
version: '1.0'
category: self_evolve
difficulty: hard
services:
- name: x_mock
  command: python mock_services/x/server.py
  port: 3300
  health_check: http://localhost:3300/health
  ready_timeout: 10
  reset_endpoint: http://localhost:3300/x/reset
  env:
    X_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fx01_x/learn_b.json
  health_check_method: GET
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fx01_x/kb_brief.json
prompt:
  text: 'You are the social media agent for @corp_x. Review the latest mentions and
    timeline,

    then engage with each post according to company social media policy.


    The KB only has a brief policy index in this episode. Use any procedure retained
    from the earlier onboarding reference if your framework preserved it.


    Use getMentions, getTimeline, and getUserProfile as needed before deciding on
    actions.

    '
  language: en
tools:
- name: x_action
  description: Execute an X (Twitter) action
  input_schema:
    type: object
    properties:
      action:
        type: string
        enum:
        - getTimeline
        - getMentions
        - getTweet
        - replyToTweet
        - postTweet
        - quoteTweet
        - sendDM
        - likeTweet
        - retweetTweet
        - getUserProfile
      tweetId:
        type: string
        description: Tweet ID for tweet-specific actions
      text:
        type: string
        description: Text content for postTweet, replyToTweet, quoteTweet
      recipientId:
        type: string
        description: User ID for sendDM
      username:
        type: string
        description: Username for getUserProfile
      userId:
        type: string
        description: User ID for getUserProfile
      count:
        type: integer
        description: Number of results to return
    required:
    - action
- name: kb_search
  description: Search the knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article by ID
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
tool_endpoints:
- tool_name: x_action
  url: http://localhost:3300/x/action
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 25
judge_rubric: 'Near-transfer reinforcement. Agent should apply the learned engagement
  protocol without SOP hint. T020 (positive, 4500 followers, ≥1000) → reply with #CorpX
  hashtag. T021 (positive, 80 followers, <1000) → like only. T022 (negative mention)
  → DM only, never public reply. T023 (verified expert) → quote-tweet with company
  perspective. T024 (competitor-tagged) → ignore entirely. Agent should use retained
  procedural knowledge from Learn A; the brief KB alone is not enough to reconstruct
  all action rules.

  '
