task_id: SE_FX01_I03B
task_name: Self-Evolve X Engagement Protocol — Eval Far
version: '1.0'
category: self_evolve
difficulty: hard
requires_fresh_session: true
services:
- name: x_mock
  command: python mock_services/x/server.py
  port: 3300
  health_check: http://localhost:3300/health
  ready_timeout: 10
  reset_endpoint: http://localhost:3300/x/reset
  env:
    X_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fx01_x/eval_far.json
  health_check_method: GET
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fx01_x/kb_brief.json
prompt:
  text: 'If you previously saved a skill for the X engagement protocol, retrieve and
    apply it now.


    You are the social media agent for @greenware_hq. Review the latest mentions and
    timeline,

    then engage with each post according to standard social media policy.


    Use getMentions, getTimeline, and getUserProfile as needed.

    '
  language: en
tools:
- name: x_action
  description: Execute an X (Twitter) action
  input_schema:
    type: object
    properties:
      action:
        type: string
        enum:
        - getTimeline
        - getMentions
        - getTweet
        - replyToTweet
        - postTweet
        - quoteTweet
        - sendDM
        - likeTweet
        - retweetTweet
        - getUserProfile
      tweetId:
        type: string
        description: Tweet ID for tweet-specific actions
      text:
        type: string
        description: Text content for postTweet, replyToTweet, quoteTweet
      recipientId:
        type: string
        description: User ID for sendDM
      username:
        type: string
        description: Username for getUserProfile
      userId:
        type: string
        description: User ID for getUserProfile
      count:
        type: integer
        description: Number of results to return
    required:
    - action
- name: kb_search
  description: Search the knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article by ID
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
tool_endpoints:
- tool_name: x_action
  url: http://localhost:3300/x/action
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 25
judge_rubric: 'Far-transfer evaluation — different product domain (greentech/ESG),
  different handle (@greenware_hq). Agent must generalize the engagement protocol
  without any SOP hint. T040 (positive, 22000 followers, ≥1000) → reply with #CorpX
  (or equivalent brand hashtag). T041 (positive, 310 followers, <1000) → like only.
  T042 (negative mention) → DM only, never public reply. T043 (verified expert relevant
  post) → quote-tweet. T044 (competitor-tagged) → ignore entirely. Zero credit if
  skill not retrieved or domain transfer fails.

  '
