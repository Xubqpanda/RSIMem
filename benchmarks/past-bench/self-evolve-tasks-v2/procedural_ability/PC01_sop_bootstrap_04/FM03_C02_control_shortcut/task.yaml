task_id: SE_FM03_C02
task_name: FM03 Control — Shortcut (Data-Sharing Exception Registry)
version: '1.0'
category: self_evolve
difficulty: hard
requires_fresh_session: true
control_type: shortcut
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fm03_helpdesk/cold.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fm03_kb/brief.json
prompt:
  text: "First, call helpdesk_list_tickets to retrieve all open tickets. Then call\
    \ helpdesk_get_ticket for each ticket to read its details. You MUST use these tools\
    \ — do NOT guess or assume ticket IDs or contents.\n\nAfter reading each ticket,\
    \ apply the following Data Sharing Exception Registry rules:\n\nDSX-001 — Analytics\
    \ Team: Pre-approved for raw data export requests. Action: tag 'data-approved',\
    \ set category=data-export, set priority=low.\nDSX-002 — Legal Team: Pre-approved\
    \ for raw data export requests (compliance and audit purposes). Action: tag 'data-approved',\
    \ set category=data-export, set priority=low.\nAll other reporters/departments:\
    \ NOT pre-approved. Action: tag 'data-share-pending', set category=data-export,\
    \ set priority=medium, add internal note: 'Awaiting DPO approval before export'.\n\
    Tickets using standard approved libraries (pandas, polars) for the export tool should\
    \ also receive tag 'export-tool-approved'.\n\nFor each ticket, call helpdesk_update_ticket\
    \ to apply the appropriate updates.\nOutput: TICKET_ID|priority|category|tags\n"
  language: en
tools:
- name: helpdesk_list_tickets
  description: List helpdesk tickets
  input_schema:
    type: object
    properties:
      status:
        type: string
    required: []
- name: helpdesk_get_ticket
  description: Get ticket details
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: Update a ticket
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
      priority:
        type: string
      tags:
        type: array
        items:
          type: string
      category:
        type: string
      status:
        type: string
      internal_note:
        type: string
    required:
    - ticket_id
- name: kb_search
  description: Search the knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 25
judge_rubric: |
  Control (shortcut): Full exception registry rules are embedded directly in the
  prompt. Measures ceiling performance when no persistence is needed.

  Expected ticket outputs (derived from the embedded SOP applied to the cold fixture):
    TK-FM03-001 | low    | data-export | data-approved, export-tool-approved
      (Analytics Team — DSX-001 pre-approved; description mentions pandas → +export-tool-approved)
    TK-FM03-002 | medium | data-export | data-share-pending
      (Marketing Team — not pre-approved; internal_note must be set to
       'Awaiting DPO approval before export'; pandas/polars not used → no export-tool-approved)

  Full credit only if BOTH tickets receive the correct priority, category, and the exact
  tag set above (set equality, order-insensitive), AND TK-FM03-002 carries the required
  internal note. Deduct for: wrong priority, missing/extra tags, missing
  export-tool-approved on TK-001 (pandas), or missing internal note on TK-002.
