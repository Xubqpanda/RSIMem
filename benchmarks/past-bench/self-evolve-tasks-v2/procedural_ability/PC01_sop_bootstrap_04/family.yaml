# §4 Semantic Metadata
what_is_learned: >
  Data-sharing approval exception registry — the procedure for evaluating
  exception requests, checking approval criteria, and updating the registry.
what_persists: >
  A durable skill artifact encoding the exception-registry SOP so approval
  decisions can be made without re-reading the policy document.
what_counts_as_reuse: >
  Agent applies the persisted exception-registry procedure to novel data-sharing
  requests with different requestors, data types, and exception categories.
false_positive_pattern: >
  Agent memorizes specific requestor names or data categories from training
  rather than extracting the general approval-exception procedure.
must_demonstrate:
- Extract a reusable exception-registry procedure from explicit SOP delivery
- Apply the procedure to novel data-sharing requests with changed entities
- Maintain correct approval criteria checks and registry update sequencing

# §13.0 Trigger Spec
trigger_category: embedded_policy
trigger_strength: T1
visibility_surface: full exception-registry policy appears as a KB policy document; the user prompt asks for ticket processing but does not mention saving a skill
trigger_injection_plan: "learn_a: full policy document contains both reusable decision criteria and one-off department examples; update_or_stabilize: brief-only KB with changed requestors"
trigger_removal_plan: eval removes SOP text; only task request remains
trigger_mixing_rule: no explicit save-skill instruction; test whether Hermes routes reusable procedure to skill instead of storing surface facts as memory
sibling_comparison_plan: compare with PC01_01..03 induction siblings for trigger-strength analysis
phase1_canonical_sibling: substrate-routing probe against T3 PC01 anchors
future_sibling_roadmap: add memory-vs-skill sibling with stronger fact distractors

# §10 Cold Design
cold_design: same datashare task before any SOP is introduced
expected_cold_result: partial solve; no stable reusable procedure

# Control Design
control_design: no_persistence, shortcut, surface_memorization, wrong_mechanism
expected_control_result: transfer gain shrinks without persisted procedure; current-reference text must not be mistaken for reusable skill persistence

