task_id: SE_FM03_I01
task_name: Data-Sharing Approval Exception Registry — Cold Start Baseline
version: '1.0'
category: self_evolve
difficulty: medium
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fm03_helpdesk/cold.json
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fm03_kb/brief.json
prompt:
  text: 'Process the open data export request tickets in the helpdesk system. Update
    each ticket with the appropriate category, priority, and tags. Output: TICKET_ID|priority|category|tags

    You MUST use helpdesk_list_tickets, helpdesk_get_ticket, and helpdesk_update_ticket
    tools to process and update tickets.

    '
  language: en
tools:
- name: helpdesk_list_tickets
  description: List helpdesk tickets
  input_schema:
    type: object
    properties:
      status:
        type: string
    required: []
- name: helpdesk_get_ticket
  description: Get ticket details
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: Update a ticket
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
      priority:
        type: string
      tags:
        type: array
        items:
          type: string
      category:
        type: string
      status:
        type: string
      internal_note:
        type: string
    required:
    - ticket_id
- name: kb_search
  description: Search the knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
environment:
  timeout_seconds: 300
  max_turns: 25
judge_rubric: |
  Cold-start baseline: no exception registry available; the agent must process tickets
  from raw description alone. Both tickets in the cold fixture are TK-FM03-001
  (Analytics Team / pandas) and TK-FM03-002 (Marketing Team).

  MUST-haves (no SOP knowledge required, fail/heavy deduction if absent):
    - Call helpdesk_list_tickets, helpdesk_get_ticket, and helpdesk_update_ticket
      for BOTH tickets (verified via tool-call audit, not just text output).
    - Set category=data-export for BOTH tickets (clearly stated in the descriptions).
    - Emit one output line per ticket in TICKET_ID|priority|category|tags format.

  MUST-NOT-haves (cap score if present — these reveal SOP leakage the cold agent
  should not have):
    - Tags 'data-approved', 'data-share-pending', or 'export-tool-approved' on any
      ticket. These names come from the exception registry, which is not exposed in
      the cold prompt; producing them implies the agent already had the SOP.
    - An internal note phrased as 'Awaiting DPO approval ...' (same leak signal).

  Partial credit allowed for plausible priority/tag choices invented without the SOP
  (e.g. 'export', 'data-request', 'pending-review'). Full credit only if MUST-haves
  are met AND no MUST-NOT-have appears.
