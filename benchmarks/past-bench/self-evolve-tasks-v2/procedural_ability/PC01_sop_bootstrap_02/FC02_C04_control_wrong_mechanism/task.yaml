task_id: V2_FC02_C04
task_name: Procedural Control - Wrong Mechanism
version: '1.0'
category: self_evolve
difficulty: hard
requires_fresh_session: true
control_type: wrong_mechanism
persistence_disabled: true
environment:
  timeout_seconds: 300
  max_turns: 25
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fc02_helpdesk/eval_near.json
    PORT: '9107'
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fc02_kb/sop_full.json
    PORT: '9106'
tools:
- name: helpdesk_list_tickets
  description: List helpdesk tickets
  input_schema:
    type: object
    properties:
      status:
        type: string
    required: []
- name: helpdesk_get_ticket
  description: Get ticket details
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: Update a ticket
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
      priority:
        type: string
      tags:
        type: array
        items:
          type: string
      category:
        type: string
    required:
    - ticket_id
- name: kb_search
  description: Search the knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
prompt:
  text: |
    Read the current knowledge-base article and apply the operating procedure it describes to the current task data.
    The procedure is deliberately available as plain current reference text, not as a reusable skill artifact.
    Do not create or read a skill artifact for this control. Do not close tickets.
    Output one line per updated ticket: TICKET_ID|priority|category|why

    Use the available task tools after reading the article to complete the task.
  language: en
judge_rubric: 'Control (surface_memorization): The prompt gives only surface keywords
  (pipeline, data analysis, data quality) without explaining the actual SOP procedure
  rules (five-step pipeline, specific tag names pipeline-complete/data-sev-medium,
  category=data-analysis, priority=medium). If the agent scores high just from keyword
  cues, the eval is not testing real procedure understanding. Reward correct pipeline
  tagging of TK-R401-R403. Penalize including non-analysis distractor TK-R404.

  '
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
