# §4 Semantic Metadata
what_is_learned: >
  Data pipeline workflow SOP — the ordered procedure for diagnosing stalled
  pipelines, checking upstream dependencies, and restarting stages.
what_persists: >
  A durable skill artifact encoding the pipeline triage and recovery SOP
  for reuse across sessions.
what_counts_as_reuse: >
  Agent applies the persisted pipeline SOP to new stalled-pipeline scenarios
  with different stage names and upstream configurations.
false_positive_pattern: >
  Agent memorizes specific pipeline names or stage IDs from training cases
  rather than extracting the general diagnostic procedure.
must_demonstrate:
- Extract a reusable pipeline recovery procedure from explicit SOP delivery
- Apply the procedure to novel pipeline configurations with changed entities
- Preserve correct diagnostic ordering and dependency-check logic

# §13.0 Trigger Spec
trigger_category: weak_explicit_future_use
trigger_strength: T2
visibility_surface: full pipeline SOP is available, but the prompt only hints that it is a recurring standard and never commands skill creation
trigger_injection_plan: learn_a exposes the full pipeline SOP with future-use wording; update_or_stabilize uses a surface-varied case with brief-only KB
trigger_removal_plan: eval removes SOP text; only novel pipeline scenarios remain
trigger_mixing_rule: no direct save-skill instruction; future-use hint is the only trigger
sibling_comparison_plan: compare with PC03 induction families for trigger-strength analysis
phase1_canonical_sibling: compare against PC01_01 T3 explicit anchor
future_sibling_roadmap: T1 embedded-note version

# §10 Cold Design
cold_design: same pipeline task before any SOP exposure
expected_cold_result: partial solve; no stable reusable procedure

# Control Design
control_design: no_persistence, shortcut, surface_memorization, wrong_mechanism
expected_control_result: transfer gain shrinks without persisted procedure; current-reference text must not be mistaken for reusable skill persistence

