task_id: V2_FC02_C02
task_name: FC02 Control — Shortcut (SOP in Prompt)
version: '1.0'
category: self_evolve
difficulty: hard
requires_fresh_session: true
control_type: shortcut
environment:
  timeout_seconds: 300
  max_turns: 25
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9107
  health_check: http://localhost:9107/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9107/helpdesk/reset
  env:
    HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fc02_helpdesk/cold.json
    PORT: '9107'
- name: kb
  command: python mock_services/kb/server.py
  port: 9106
  health_check: http://localhost:9106/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9106/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fc02_kb/brief.json
    PORT: '9106'
tools:
- name: helpdesk_list_tickets
  description: List helpdesk tickets
  input_schema:
    type: object
    properties:
      status:
        type: string
    required: []
- name: helpdesk_get_ticket
  description: Get ticket details
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: Update a ticket
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
      priority:
        type: string
      tags:
        type: array
        items:
          type: string
      category:
        type: string
    required:
    - ticket_id
- name: kb_search
  description: Search the knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
prompt:
  text: "First, call helpdesk_list_tickets to retrieve all open tickets. Then call\
    \ helpdesk_get_ticket for each ticket to read its details. You MUST use these tools\
    \ — do NOT guess or assume ticket IDs or contents.\n\nAfter reading each ticket,\
    \ apply the following SOP to decide which tickets to update:\n\n## Data Quality\
    \ Analysis SOP v1\n\nWhen a ticket is a data analysis issue (retention, conversion\
    \ rate, aggregation report, metric anomalies, etc.), apply the following five-step\
    \ pipeline:\n1. Data cleaning (pipeline-clean)\n2. Normalization (pipeline-normalize)\n\
    3. Outlier filtering (pipeline-filter)\n4. Aggregation (pipeline-aggregate)\n5.\
    \ Report generation (pipeline-report)\n\nAll data analysis tickets MUST be tagged\
    \ pipeline-complete and data-sev-medium, category set to data-analysis, priority\
    \ set to medium.\n\nNon-analysis requests (demos, hardware, meeting bookings)\
    \ do NOT follow this process.\n\nFor each ticket that matches, call helpdesk_update_ticket\
    \ to update it.\nOutput: TICKET_ID|priority|category|why\n"
  language: en
judge_rubric: 'Control (shortcut): The full pipeline SOP is embedded directly in the prompt.
  Reward identifying data analysis tickets (TK-R101, TK-R102, TK-R103) and applying
  correct tagging (pipeline-complete, data-sev-medium, category=data-analysis, priority=medium).
  Penalize including non-analysis distractor TK-R104 or TK-R105.

  '
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9107/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9107/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9107/helpdesk/tickets/update
  method: POST
- tool_name: kb_search
  url: http://localhost:9106/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9106/kb/articles/get
  method: POST
