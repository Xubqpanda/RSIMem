# §4 Semantic Metadata
what_is_learned: >
  DB migration risk correlation rule — the latent pattern that EU region +
  schema version 7-to-8 + odd shard ID predicts high migration failure risk.
what_persists: >
  A durable skill artifact encoding the induced three-factor risk rule for
  reuse without re-observing the original training cases.
what_counts_as_reuse: >
  Agent applies the three-factor risk rule to novel migration requests with
  different surface features, correctly flagging risky combinations.
false_positive_pattern: >
  Agent memorizes specific shard IDs or region names from training cases
  rather than inducing the general three-factor correlation rule.
must_demonstrate:
- Induce the latent three-factor risk rule from example cases alone
- Apply the rule to novel migrations with changed surface entities
- Correctly distinguish risky from safe combinations using the induced rule

# §13.0 Trigger Spec
trigger_category: repeated_cases_induction
trigger_strength: T0
visibility_surface: multiple same-structure cases with different surface features
trigger_injection_plan: "learn_a + learn_b: two informative outcome-labeled case batches; agent must infer latent rule without SOP text"
trigger_removal_plan: eval removes shared keywords, entities, surface templates; preserves only latent procedure
trigger_mixing_rule: no explicit SOP text, direct correction, or explicit summary of the latent rule
sibling_comparison_plan: compare with PC01-style direct teaching for sample efficiency analysis
phase1_canonical_sibling: native weaker-trigger family; not a trigger-strength anchor
future_sibling_roadmap: compare against PC01-style direct teaching once trigger-strength ladders are ready

# §10 Cold Design
cold_design: first task exposes the latent workflow before enough cases exist to induce it
expected_cold_result: low-to-mid score; no rule abstraction yet

# Control Design
control_design: shortcut, too_few_examples, wrong_mechanism, no_persistence
expected_control_result: without enough learn examples or durable skill state, transfer collapses; current-reference text and surface matching are separate controls

