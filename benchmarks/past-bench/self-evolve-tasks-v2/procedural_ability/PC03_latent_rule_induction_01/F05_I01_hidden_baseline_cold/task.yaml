task_id: V2_F05_I01
task_name: F05 Hidden Correlation — DB Migration Cold Start
version: '1.0'
category: self_evolve
difficulty: hard
environment:
  timeout_seconds: 300
  max_turns: 25
services:
- name: helpdesk
  command: python mock_services/helpdesk/server.py
  port: 9200
  health_check: http://localhost:9200/helpdesk/tickets
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9200/helpdesk/reset
  env:
    HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f05_helpdesk/cold.json
    PORT: '9200'
- name: kb
  command: python mock_services/kb/server.py
  port: 9201
  health_check: http://localhost:9201/kb/search
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9201/kb/reset
  env:
    KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f05_kb/brief.json
    PORT: '9201'
tools:
- name: helpdesk_list_tickets
  description: List helpdesk tickets
  input_schema:
    type: object
    properties:
      status:
        type: string
    required: []
- name: helpdesk_get_ticket
  description: Get ticket details
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: Update a ticket
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
      priority:
        type: string
      tags:
        type: array
        items:
          type: string
      category:
        type: string
    required:
    - ticket_id
- name: kb_search
  description: Search the knowledge base
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: kb_get_article
  description: Get a knowledge base article
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
prompt:
  text: 'Search the KB for the database migration incident triage rule. The KB only
    has a brief —

    not the full correlation rule. Process the open tickets. Identify and escalate
    any that

    show migration risk signals. Read each ticket carefully and check for: (1) EU
    region,

    (2) schema upgrade version, (3) shard count. Update tickets accordingly.

    Output: TICKET_ID|priority|category|tags

    You MUST use helpdesk_list_tickets, helpdesk_get_ticket, and helpdesk_update_ticket
    tools to process and update tickets.

    '
  language: en
judge_rubric: 'Reward identifying TK-M104 (EU, schema 7->8, odd shard=5) as migration-risk-critical.
  Penalize flagging near-miss tickets TK-M101/M102/M103 as risk.

  '
tool_endpoints:
- tool_name: helpdesk_list_tickets
  url: http://localhost:9200/helpdesk/tickets
  method: POST
- tool_name: helpdesk_get_ticket
  url: http://localhost:9200/helpdesk/tickets/get
  method: POST
- tool_name: helpdesk_update_ticket
  url: http://localhost:9200/helpdesk/tickets/update
  method: POST
- tool_name: kb_search
  url: http://localhost:9201/kb/search
  method: POST
- tool_name: kb_get_article
  url: http://localhost:9201/kb/articles/get
  method: POST
