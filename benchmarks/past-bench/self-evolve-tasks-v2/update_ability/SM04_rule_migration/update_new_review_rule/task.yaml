task_id: SM04_UPDATE_001
task_name: Semantic Memory SM04 Update New Review Rule
version: "1.0"
category: self_evolve
difficulty: medium

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/update_ability/SM04_rule_migration/update_new_review_rule/fixtures/notes.json

prompt:
  text: |
    Review the migration note, extract the action items, apply the team's current review rule in your final answer, and share the source note according to that rule.
    Authoritative migration for future reviews:
    - Aurora-2S is deprecated immediately.
    - Save and use this new rule going forward.
    - Output one line per action item as <owner> | Borealis-4DQ | task | due_date.
    - Share the source note only with High priority owners.
    - Medium and Low priority owners should still appear in the final answer but should not receive the note share.
    Apply the migrated rule now and in later similar sessions.
  language: en

tools:
  - name: notes_list
    description: List meeting notes
    input_schema: {type: object, properties: {max_results: {type: integer}}, required: []}
  - name: notes_get
    description: Get meeting note details
    input_schema: {type: object, properties: {note_id: {type: string}}, required: [note_id]}
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients: {type: array, items: {type: string}}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9105/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9105/notes/get, method: POST}
  - {tool_name: notes_share, url: http://localhost:9105/notes/share, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 20

judge_rubric: "Reward an answer that overwrites the old Aurora-2S rule with the new Borealis-4DQ rule and shares the note only with High priority owners."
