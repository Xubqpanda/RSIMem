task_id: SM04_CONTROL_003
task_name: Semantic Memory SM04 Control No Persistence Rule
version: "1.0"
category: self_evolve
difficulty: hard

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/update_ability/SM04_rule_migration/control_no_persistence_rule/fixtures/notes.json

prompt:
  text: |
    Review today's API review note, extract the action items, apply the team's current review rule in your final answer, and share the source note according to that rule.
  language: en

tools:
  - name: notes_list
    description: List meeting notes
    input_schema: {type: object, properties: {max_results: {type: integer}}, required: []}
  - name: notes_get
    description: Get meeting note details
    input_schema: {type: object, properties: {note_id: {type: string}}, required: [note_id]}
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients: {type: array, items: {type: string}}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9105/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9105/notes/get, method: POST}
  - {tool_name: notes_share, url: http://localhost:9105/notes/share, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 20

judge_rubric: "No-persistence ablation. The agent has no access to memory. Without the persisted review rule, the agent cannot know Borealis-4DQ format or the High-priority-only share policy and is expected to fail."
