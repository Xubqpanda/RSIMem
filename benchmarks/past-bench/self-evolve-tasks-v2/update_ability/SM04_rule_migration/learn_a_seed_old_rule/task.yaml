task_id: SM04_LEARN_A_001
task_name: Semantic Memory SM04 Learn A Seed Old Rule
version: "1.0"
category: self_evolve
difficulty: medium

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/update_ability/SM04_rule_migration/learn_a_seed_old_rule/fixtures/notes.json

prompt:
  text: |
    Review today's standards note, extract the action items, apply the team's current review rule in your final answer, and share the source note according to that rule.
    Save this current long-term review rule for future similar reviews until an official migration replaces it:
    - Output one line per action item as <owner> | Aurora-2S | task | due_date.
    - Share the source note with all owners listed in the note.
    Apply that saved rule now.
  language: en

tools:
  - name: notes_list
    description: List meeting notes
    input_schema: {type: object, properties: {max_results: {type: integer}}, required: []}
  - name: notes_get
    description: Get meeting note details
    input_schema: {type: object, properties: {note_id: {type: string}}, required: [note_id]}
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients: {type: array, items: {type: string}}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9105/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9105/notes/get, method: POST}
  - {tool_name: notes_share, url: http://localhost:9105/notes/share, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 20

judge_rubric: "Reward an answer that applies the current Aurora-2S review rule exactly and shares the source note with all listed owners."
