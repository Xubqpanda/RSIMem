task_id: V2_F02_I02
task_name: "F02 Billing SOP Patch — Learn A (Seed Old v1 SOP)"
category: self_evolve
difficulty: hard

services:
  - name: helpdesk
    command: python mock_services/helpdesk/server.py
    port: 9200
    health_check: http://localhost:9200/helpdesk/tickets
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9200/helpdesk/reset
    env:
      HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f02_helpdesk/seed.json
      PORT: "9200"
  - name: kb
    command: python mock_services/kb/server.py
    port: 9201
    health_check: http://localhost:9201/kb/search
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9201/kb/reset
    env:
      KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f02_kb/v1_sop.json
      PORT: "9201"

prompt:
  text: |
    Search the KB for the Billing Incident SOP. Read the full SOP carefully and apply it
    to the open helpdesk tickets. The SOP defines specific escalation thresholds, priority
    labels, categories, and tags — follow them exactly.

    After you have applied the SOP, save it as a reusable skill so you can use it again
    in future billing incident triage sessions without needing to search the KB again.

    Do NOT close any ticket — leave resolution to the on-call billing engineer.
    Output one line per updated ticket: TICKET_ID|priority|category|why
  language: en

tools:
  - name: helpdesk_list_tickets
    description: List all open helpdesk tickets.
    input_schema:
      type: object
      properties:
        status:
          type: string
          description: Filter by ticket status (e.g., open, closed).
      required: []
  - name: helpdesk_get_ticket
    description: Get details of a specific helpdesk ticket.
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
          description: The ticket ID to retrieve.
      required:
        - ticket_id
  - name: helpdesk_update_ticket
    description: Update a helpdesk ticket with new priority, category, status, or tags.
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
          description: The ticket ID to update.
        priority:
          type: string
          description: New priority value.
        category:
          type: string
          description: New category value.
        status:
          type: string
          description: New status value.
        tags:
          type: array
          items:
            type: string
          description: Tags to apply to the ticket.
      required:
        - ticket_id
  - name: kb_search
    description: Search the knowledge base for articles matching a query.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search query string.
      required:
        - query
  - name: kb_get_article
    description: Retrieve a specific knowledge base article by ID.
    input_schema:
      type: object
      properties:
        article_id:
          type: string
          description: The article ID to retrieve.
      required:
        - article_id

tool_endpoints:
  - tool_name: helpdesk_list_tickets
    url: http://localhost:9200/helpdesk/tickets
    method: POST
  - tool_name: helpdesk_get_ticket
    url: http://localhost:9200/helpdesk/tickets/get
    method: POST
  - tool_name: helpdesk_update_ticket
    url: http://localhost:9200/helpdesk/tickets/update
    method: POST
  - tool_name: kb_search
    url: http://localhost:9201/kb/search
    method: POST
  - tool_name: kb_get_article
    url: http://localhost:9201/kb/articles/get
    method: POST

environment:
  timeout_seconds: 300
  max_turns: 25

judge_rubric: "Learn A — seed v1 SOP. Reward: (1) searching KB and reading the v1 SOP, (2) correctly applying v1 rules — escalating TK-F101 and TK-F102 with priority=high, category=incident, tag=incident-core (threshold=2+, same billing-cluster-1), (3) NOT escalating TK-F103/TK-F104 (different root causes), (4) saving the SOP as a reusable skill. Penalize missing skill creation."
