# §4 Semantic Metadata
what_is_learned: >
  Billing incident SOP v2 patch — the updated procedure that supersedes v1,
  including revised escalation thresholds and new resolution paths.
what_persists: >
  A durable skill artifact encoding the patched v2 SOP, overwriting the
  previously stored v1 procedure.
what_counts_as_reuse: >
  Agent applies the v2 SOP (not v1) to novel billing incidents, demonstrating
  that the patch was absorbed and the stale procedure was replaced.
false_positive_pattern: >
  Agent applies a blend of v1 and v2 steps, or reverts to v1 under surface
  pressure, indicating the patch was not fully committed.
must_demonstrate:
- Absorb the v1-to-v2 patch and overwrite the stored procedure
- Apply only v2 steps to novel billing incidents without v1 leakage
- Resist regression to stale v1 procedure under new surface wording

# §13.0 Trigger Spec
trigger_category: conflict_update
trigger_strength: T3
visibility_surface: direct authoritative patch notice in prompt
trigger_injection_plan: "initial_home_fixture: seed old SOP in native Hermes skills with memory/session distractors; update_or_stabilize: inject patch/drift information"
initial_home_fixture_plan: "The old v1 SOP is seeded in native Hermes skills with memory and session distractors before the update episode."
trigger_removal_plan: eval makes stale SOP actively wrong; rewards only patched behavior
trigger_mixing_rule: no failure_reflection; patch by update only
sibling_comparison_plan: PC02B_patch_by_reflection should be separate
phase1_canonical_sibling: this is the T3 canonical anchor
future_sibling_roadmap: reflection-based patch sibling; embedded patch-note sibling

# §10 Cold Design
cold_design: "Run the same skill-retrieval workflow as eval from the stale native Hermes home fixture and score cold against the patched SOP."
expected_cold_result: "Cold should expose how much of the eval score is unavailable before the patch lands, even though the stale SOP is already present in Hermes home."

# Control Design
control_design: no_persistence, shortcut, stale_procedure
expected_control_result: without persistence or patch uptake, agent regresses toward stale procedure

