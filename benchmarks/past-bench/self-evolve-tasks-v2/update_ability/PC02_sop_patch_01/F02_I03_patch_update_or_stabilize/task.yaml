task_id: V2_F02_I03
task_name: "F02 Billing SOP Patch — Update (Inject v2 SOP)"
category: self_evolve
difficulty: hard

services:
  - name: helpdesk
    command: python mock_services/helpdesk/server.py
    port: 9200
    health_check: http://localhost:9200/helpdesk/tickets
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9200/helpdesk/reset
    env:
      HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f02_helpdesk/drift.json
      PORT: "9200"
  - name: kb
    command: python mock_services/kb/server.py
    port: 9201
    health_check: http://localhost:9201/kb/search
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9201/kb/reset
    env:
      KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/f02_kb/v2_sop.json
      PORT: "9201"

prompt:
  text: |
    The KB has been updated with a revised Billing Incident SOP (v2). The old SOP (v1) is
    now outdated and deprecated. Read the new SOP carefully — the escalation threshold,
    priority label, category, and required tags have ALL changed from v1.

    If you have a saved v1 SOP skill, UPDATE it to reflect the v2 rules now. Do not keep
    the old v1 procedure — it is deprecated and will produce incorrect results.
    Inspect the existing saved SOP skill before applying the patch, then patch that skill
    to v2; do not rely on a skill listing or stale summary alone.

    Apply the NEW v2 SOP to the open helpdesk tickets.

    Do NOT close any ticket — leave resolution to the on-call billing engineer.
    Output one line per updated ticket: TICKET_ID|priority|category|why
  language: en

tools:
  - name: helpdesk_list_tickets
    description: List all open helpdesk tickets.
    input_schema:
      type: object
      properties:
        status:
          type: string
          description: Filter by ticket status (e.g., open, closed).
      required: []
  - name: helpdesk_get_ticket
    description: Get details of a specific helpdesk ticket.
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
          description: The ticket ID to retrieve.
      required:
        - ticket_id
  - name: helpdesk_update_ticket
    description: Update a helpdesk ticket with new priority, category, status, or tags.
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
          description: The ticket ID to update.
        priority:
          type: string
          description: New priority value.
        category:
          type: string
          description: New category value.
        status:
          type: string
          description: New status value.
        tags:
          type: array
          items:
            type: string
          description: Tags to apply to the ticket.
      required:
        - ticket_id
  - name: kb_search
    description: Search the knowledge base for articles matching a query.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search query string.
      required:
        - query
  - name: kb_get_article
    description: Retrieve a specific knowledge base article by ID.
    input_schema:
      type: object
      properties:
        article_id:
          type: string
          description: The article ID to retrieve.
      required:
        - article_id

tool_endpoints:
  - tool_name: helpdesk_list_tickets
    url: http://localhost:9200/helpdesk/tickets
    method: POST
  - tool_name: helpdesk_get_ticket
    url: http://localhost:9200/helpdesk/tickets/get
    method: POST
  - tool_name: helpdesk_update_ticket
    url: http://localhost:9200/helpdesk/tickets/update
    method: POST
  - tool_name: kb_search
    url: http://localhost:9201/kb/search
    method: POST
  - tool_name: kb_get_article
    url: http://localhost:9201/kb/articles/get
    method: POST

environment:
  timeout_seconds: 300
  max_turns: 25

judge_rubric: "Update — inject v2 SOP. Reward: (1) reading the new v2 SOP from KB, (2) applying v2 rules to billing-cluster-2 incident (TK-G201, TK-G202, TK-G203) — threshold=3+, priority=critical, category=incident-billing, tags=[incident-core, billing-sla-breach], (3) NOT escalating TK-G204/TK-G205 (routine requests), (4) updating the saved skill from v1 to v2. Penalize using v1 labels (priority=high, category=incident)."
