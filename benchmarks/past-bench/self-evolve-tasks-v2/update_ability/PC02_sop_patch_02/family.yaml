# §4 Semantic Metadata
what_is_learned: >
  Error-correction procedure patch — the updated diagnostic and correction
  sequence that supersedes the original, with revised check ordering.
what_persists: >
  A durable skill artifact encoding the patched error-correction procedure,
  overwriting the previously stored original sequence.
what_counts_as_reuse: >
  Agent applies the corrected procedure (not the original) to novel error
  scenarios, demonstrating the correction was absorbed and persisted.
false_positive_pattern: >
  Agent applies a mix of old and new check orderings, or reverts to the
  original sequence under surface variation, indicating incomplete uptake.
must_demonstrate:
- Absorb the correction patch and overwrite the stored procedure
- Apply only the corrected check sequence to novel error scenarios
- Resist regression to the original procedure under changed surface wording

# §13.0 Trigger Spec
trigger_category: weak_conflict_update
trigger_strength: T2
visibility_surface: correction appears as an operational revision memo; the prompt does not directly command a skill overwrite
trigger_injection_plan: "initial_home_fixture: seed flawed HTTP client skill with memory/session distractors; update_or_stabilize: expose corrected guide and revision memo without an explicit overwrite command"
trigger_removal_plan: eval penalizes stale procedure; rewards only corrected path
trigger_mixing_rule: no failure_reflection; update-driven only, but overwrite must be inferred from the correction notice
sibling_comparison_plan: reflection-based patch sibling should be separate
phase1_canonical_sibling: compare against PC02_01 T3 canonical patch
future_sibling_roadmap: reflection-based correction sibling; T1 embedded changelog sibling

# §10 Cold Design
cold_design: "Run the same skill-retrieval workflow as eval from the stale native Hermes home fixture and score cold against the corrected HTTP client policy."
expected_cold_result: "Cold should provide the pre-correction baseline against the same post-correction target that eval uses, with the stale skill already seeded in Hermes home."

# Control Design
control_design: no_persistence, shortcut, stale_procedure
expected_control_result: without persistence, agent reverts to stale procedure

