task_id: FC04_I02
task_name: Deprecated API Error Correction — Seed OLD Flawed Rule
version: "1.0"
category: self_evolve
difficulty: hard

services:
  - name: helpdesk
    command: python mock_services/helpdesk/server.py
    port: 9107
    health_check: http://localhost:9107/helpdesk/tickets
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9107/helpdesk/reset
    env:
      HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fc04_helpdesk/learn_a.json
  - name: kb
    command: python mock_services/kb/server.py
    port: 9106
    health_check: http://localhost:9106/kb/search
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9106/kb/reset
    env:
      KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fc04_kb/deprecation_guide_v1_flawed.json

prompt:
  text: |
    Search the knowledge base for the "HTTP Client Migration Guide" and read the approved standards carefully.
    The guide defines which HTTP client libraries are approved and which are deprecated.
    Review the open tickets, apply the rules from the guide, and save the rule as a skill so you can apply it in future sessions.
    Output: TICKET_ID|priority|category|why
  language: en

tools:
  - name: helpdesk_list_tickets
    description: List helpdesk tickets
    input_schema: {type: object, properties: {status: {type: string}}, required: []}
  - name: helpdesk_get_ticket
    description: Get ticket details
    input_schema: {type: object, properties: {ticket_id: {type: string}}, required: [ticket_id]}
  - name: helpdesk_update_ticket
    description: Update a ticket
    input_schema:
      type: object
      properties:
        ticket_id: {type: string}
        priority: {type: string}
        tags: {type: array, items: {type: string}}
        category: {type: string}
      required: [ticket_id]
  - name: kb_search
    description: Search the knowledge base
    input_schema:
      type: object
      properties:
        query: {type: string}
        category: {type: string}
        max_results: {type: integer}
      required: [query]
  - name: kb_get_article
    description: Get a knowledge base article
    input_schema:
      type: object
      properties:
        article_id: {type: string}
      required: [article_id]

tool_endpoints:
  - {tool_name: helpdesk_list_tickets, url: http://localhost:9107/helpdesk/tickets, method: POST}
  - {tool_name: helpdesk_get_ticket, url: http://localhost:9107/helpdesk/tickets/get, method: POST}
  - {tool_name: helpdesk_update_ticket, url: http://localhost:9107/helpdesk/tickets/update, method: POST}
  - {tool_name: kb_search, url: http://localhost:9106/kb/search, method: POST}
  - {tool_name: kb_get_article, url: http://localhost:9106/kb/articles/get, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 25

judge_rubric: "Reward an answer that reads the OLD/flawed HTTP Client guide (which says requests is approved and urllib is deprecated), applies those v1 rules to the tickets, and saves the rule as a skill. Under v1: requests PRs should be tagged api-compliant, urllib PRs should be tagged deprecated-api. This is the WRONG rule that will be corrected in the next episode."
