task_id: FC04_I02b
task_name: Deprecated API Error Correction — Inject CORRECTED v2 Rule
version: "1.0"
category: self_evolve
difficulty: hard

services:
  - name: helpdesk
    command: python mock_services/helpdesk/server.py
    port: 9107
    health_check: http://localhost:9107/helpdesk/tickets
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9107/helpdesk/reset
    env:
      HELPDESK_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fc04_helpdesk/learn_b.json
  - name: kb
    command: python mock_services/kb/server.py
    port: 9106
    health_check: http://localhost:9106/kb/search
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9106/kb/reset
    env:
      KB_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/fc04_kb/deprecation_guide.json

prompt:
  text: |
    Revision memo: The HTTP Client Migration Guide has been revised after a standards review.

    Search the knowledge base for the UPDATED "HTTP Client Migration Guide" and read the corrected rules.
    The previous guide incorrectly listed requests as the approved standard. The corrected guide reverses this:
    requests is NOW DEPRECATED, and httpx is the recommended replacement.

    If your framework maintains a reusable HTTP client standard, make sure today's decisions reflect the revised guide rather than the earlier guide.
    If a reusable HTTP client standard skill already exists, retrieve/read it and update it to the corrected rules; do not rely on a skill listing or memory summary alone.

    Then review the open tickets using the CORRECTED rules and update them accordingly.
    Output: TICKET_ID|priority|category|why
  language: en

tools:
  - name: helpdesk_list_tickets
    description: List helpdesk tickets
    input_schema: {type: object, properties: {status: {type: string}}, required: []}
  - name: helpdesk_get_ticket
    description: Get ticket details
    input_schema: {type: object, properties: {ticket_id: {type: string}}, required: [ticket_id]}
  - name: helpdesk_update_ticket
    description: Update a ticket
    input_schema:
      type: object
      properties:
        ticket_id: {type: string}
        priority: {type: string}
        tags: {type: array, items: {type: string}}
        category: {type: string}
      required: [ticket_id]
  - name: kb_search
    description: Search the knowledge base
    input_schema:
      type: object
      properties:
        query: {type: string}
        category: {type: string}
        max_results: {type: integer}
      required: [query]
  - name: kb_get_article
    description: Get a knowledge base article
    input_schema:
      type: object
      properties:
        article_id: {type: string}
      required: [article_id]

tool_endpoints:
  - {tool_name: helpdesk_list_tickets, url: http://localhost:9107/helpdesk/tickets, method: POST}
  - {tool_name: helpdesk_get_ticket, url: http://localhost:9107/helpdesk/tickets/get, method: POST}
  - {tool_name: helpdesk_update_ticket, url: http://localhost:9107/helpdesk/tickets/update, method: POST}
  - {tool_name: kb_search, url: http://localhost:9106/kb/search, method: POST}
  - {tool_name: kb_get_article, url: http://localhost:9106/kb/articles/get, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 25

judge_rubric: "Reward an answer that reads the CORRECTED v2 deprecation guide (requests is NOW deprecated, httpx is recommended), applies the corrected rule to the tickets, and avoids stale v1 behavior. Mechanism credit depends on whether the previously saved HTTP client procedure is updated rather than leaving the old requests-approved rule in place."
