task_id: SM06_LEARN_A_001
task_name: Semantic Memory SM06 Learn A Temporary Exception Seed
version: "1.0"
category: self_evolve
difficulty: medium

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/sm06_notes/learn_a.json

prompt:
  text: |
    Save this durable default for future risk-review notes:
    - Output one line per action item as <owner> | RISK-CANON | task | due_date.
    - Share the source note with all action item owners.

    Temporary exception for THIS WEEK ONLY:
    - Do not share this batch with Maya Ortiz.
    - This exception expires after this batch and must NOT be saved.

    Apply the durable default plus the temporary exception to today's note.
  language: en

tools:
  - name: notes_list
    description: List meeting notes
    input_schema: {type: object, properties: {max_results: {type: integer}}, required: []}
  - name: notes_get
    description: Get meeting note details
    input_schema: {type: object, properties: {note_id: {type: string}}, required: [note_id]}
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients: {type: array, items: {type: string}}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9105/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9105/notes/get, method: POST}
  - {tool_name: notes_share, url: http://localhost:9105/notes/share, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 20

judge_rubric: "Reward an answer that saves the durable RISK-CANON default, applies it now, but keeps the Maya Ortiz skip explicitly temporary."
