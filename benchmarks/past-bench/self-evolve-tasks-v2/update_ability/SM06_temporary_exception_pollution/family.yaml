status: authored
latent_rule_id: sm06_temporary_exception_pollution
what_is_learned: A durable risk-review default should persist, but a clearly temporary owner-specific exception should expire and never become durable memory.
what_persists: The durable RISK-CANON routing rule persists; the temporary Maya Ortiz skip should not.
what_counts_as_reuse: Later tasks still use the durable route token and share with all action item owners, including Maya once the temporary exception has expired.
false_positive_pattern: The agent remembers both the durable rule and the one-week exception, causing negative transfer after the exception expires.
must_demonstrate:
  - the native Hermes home fixture already contains the durable default plus a stale Maya exception that should be removed
  - the expired temporary exception is removed or suppressed as a lasting rule
  - unrelated active exceptions and the durable default are not clobbered
  - eval tasks fail if the expired exception resurfaces
recommended_mock_services:
  - notes
phase1_canonical_sibling: Diagnostic sibling to the semantic-memory anchors, focused on selective persistence failure rather than clean positive transfer.
future_sibling_roadmap:
  - Add a multi-exception version where two temporary exceptions expire at different times.
  - Add a weaker embedded-note variant where the temporary scope must be inferred rather than stated directly.
  - Add telemetry-only contamination analysis if the controller work needs more precise harmful-persistence attribution.
cold_design: "Use the same retrieval-demanding workflow as eval from the stale native Hermes home fixture and judge it against the post-expiry target."
expected_cold_result: "Cold should quantify pre-update miss rate: the stale Maya exception is present from the start, but the task is already judged against the post-expiry RISK-CANON-only target."
control_design: no_persistence removes the stored default; shortcut exposes the current durable rule locally; wrong_mechanism places the active rule and expired-exception notice inside the current note instead of memory.
expected_control_result: If the temporary exception pollutes memory, with_persistence can underperform no_persistence on later notes; shortcut and wrong_mechanism remain locally solvable.
authoring_notes: This family is intentionally asymmetric. The durable default should help, but the bad case is that a temporary exception contaminates later reuse and causes negative transfer.
