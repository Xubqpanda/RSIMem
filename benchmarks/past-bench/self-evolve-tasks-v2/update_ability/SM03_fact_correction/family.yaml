secondary_abilities: []
primary_trigger: conflict_update
trigger_category: conflict_update
trigger_strength: T3
trigger_visibility_paths:
  - direct_user_message
benchmark_role: canonical_anchor
compatibility_gate: strict
trigger_class: conflict_update
secondary_triggers: []
optional_supporting_trigger: explicit_instruction
supporting_stage: update_or_stabilize
supporting_signal: native Hermes home fixture supplies stale target state plus cross-mechanism distractors before the measured update
supporting_signals: []
distractor_signals: []
trigger_injection_plan:
  initial_home_fixture: initialize stale Phoenix fact, similar facts, unrelated facts, stale skills, and prior sessions in native Hermes persistence
  update_or_stabilize: inject the authoritative correction and make the overwrite relation explicit
primary_trigger_stages:
  - update_or_stabilize
trigger_removal_plan:
  eval_near: reference the entity naturally but do not expose the corrected value in the prompt
  eval_far: keep the corrected value absent and penalize any stale-value leakage
trigger_mixing_rule: Do not combine explicit_correction and conflict_update as co-equal triggers; this family should stay overwrite-centered.
sibling_comparison_plan: If needed, compare against a separate feedback-based correction sibling rather than mixing user correction into this family.
expected_substrate: memory
autonomy_required: true
evaluation_requires_reuse: true
transfer_distance: near_far
overwrite_mode: required
noise_profile: medium
family_length_tier: tier2
implementation_priority: phase1
instances_per_bucket:
  cold: 1
  update_or_stabilize: 1
  eval_near: 1
  eval_far: 1
  control: 3
total_episodes: 7
episode_order:
  - cold_fact_baseline
