        - control_fact_correction_control
    - mode: continue
      episodes:
        - update_corrected_freeze_date
    - mode: from_anchor
      anchor: sm03_post_update
      episodes:
        - eval_near_use_corrected_fact
        - eval_far_use_corrected_fact
episode_overrides:
  cold_fact_baseline:
    mechanism: memory
    expected_persistence_signal: memory
    persistence_allowed: true
    initial_home_fixture_dir: self-evolve-tasks-v2/_shared/home_fixtures/update_ability/SM03_fact_correction
  update_corrected_freeze_date:
    mechanism: memory
    expected_persistence_signal: memory
    persistence_allowed: true
control_set:
  - no_persistence
  - shortcut
  - wrong_mechanism
status: authored
latent_rule_id: sm03_fact_correction
what_is_learned: A previously stored fact has been superseded by a newer authoritative value.
what_persists: The corrected fact overwrites the stale fact in memory.
what_counts_as_reuse: Later tasks use only the new value and never leak the stale value.
false_positive_pattern: The agent infers the new value from current prompt artifacts without actually replacing stored state.
must_demonstrate:
  - the native Hermes home fixture already contains the stale fact plus similar and unrelated distractors
  - the authoritative correction overwrites the old fact
  - adjacent Phoenix and non-Phoenix facts are preserved rather than globally overwritten
  - later tasks penalize stale fact leakage
recommended_mock_services:
  - notes
  - finance
  - crm
phase1_canonical_sibling: A T3 direct overwrite family where the user explicitly states that the old fact is obsolete and the new fact must be saved for future sessions.
future_sibling_roadmap:
  - Add a T2 direct overwrite sibling without explicit save wording.
  - Add a T1 embedded update-note sibling where the correction must be extracted from the note.
  - Add a user-feedback overwrite sibling for trigger-strength comparison.
cold_design: "Use the same retrieval-demanding workflow as eval while starting from the stale native Hermes home fixture, and judge cold against the corrected post-update target."
expected_cold_result: "Cold should serve as the pre-update contrast point: the stale seeded home is present from the start, but without the authoritative correction the agent should score poorly against the corrected target."
control_design: Measure no_persistence through the runtime ablation, add one shortcut control where the corrected fact is visible locally, and keep one stale-leakage control with no local corrected value.
expected_control_result: Without persistence or overwrite, behavior should revert toward the stale fact, guessing, or failure to prefer the corrected value cleanly; shortcut controls should only succeed because the fact is locally exposed.
authoring_notes: Favor factual values with clean overwrite scoring, such as quotas, budgets, deadlines, or named contacts.
