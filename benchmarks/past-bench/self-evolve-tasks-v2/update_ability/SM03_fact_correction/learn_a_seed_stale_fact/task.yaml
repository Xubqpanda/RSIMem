task_id: SM03_LEARN_A_001
task_name: Semantic Memory SM03 Learn A Seed Stale Fact
version: "1.0"
category: self_evolve
difficulty: medium

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/update_ability/SM03_fact_correction/learn_a_seed_stale_fact/fixtures/notes.json

prompt:
  text: |
    Review today's Phoenix planning note, extract the action items, include the current Phoenix freeze date in your final summary, and share the source note with the rollout owners.
    Save this current project fact for future Phoenix work until an official correction replaces it:
    - The Phoenix release freeze date is 2026-06-14.
    Use that date in this answer and in later similar sessions unless a newer authoritative update replaces it.
  language: en

tools:
  - name: notes_list
    description: List meeting notes
    input_schema: {type: object, properties: {max_results: {type: integer}}, required: []}
  - name: notes_get
    description: Get meeting note details
    input_schema: {type: object, properties: {note_id: {type: string}}, required: [note_id]}
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients: {type: array, items: {type: string}}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9105/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9105/notes/get, method: POST}
  - {tool_name: notes_share, url: http://localhost:9105/notes/share, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 20

judge_rubric: "Reward an answer that captures the currently stated Phoenix freeze date and treats it as a durable fact for later rollout work."
