task_id: SM07_CONTROL_003
task_name: Semantic Memory SM07 Control Scoped Rule Migration
version: "1.0"
category: self_evolve
difficulty: hard

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/sm07_notes/control_in_note.json

prompt:
  text: |
    Review today's mixed security and ops note, extract the action items, and share the source note accordingly.
    In your final answer, output one formatted line per action item using the active scoped routing token for that scope, then share the source note according to the current scoped routing memo if the note provides one.
    Use this exact format: <Scope> | <Owner> | <RoutingToken> | <Task> | <DueDate>.
  language: en

tools:
  - name: notes_list
    description: List meeting notes
    input_schema: {type: object, properties: {max_results: {type: integer}}, required: []}
  - name: notes_get
    description: Get meeting note details
    input_schema: {type: object, properties: {note_id: {type: string}}, required: [note_id]}
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients: {type: array, items: {type: string}}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9105/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9105/notes/get, method: POST}
  - {tool_name: notes_share, url: http://localhost:9105/notes/share, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 20

judge_rubric: "Wrong-mechanism control. Reward correct scoped routing because the current memo is embedded in the note itself rather than retrieved from memory."
