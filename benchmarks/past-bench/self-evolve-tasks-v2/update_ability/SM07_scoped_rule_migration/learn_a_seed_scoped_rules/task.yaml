task_id: SM07_LEARN_A_001
task_name: Semantic Memory SM07 Learn A Seed Scoped Rules
version: "1.0"
category: self_evolve
difficulty: medium

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/sm07_notes/learn_a.json

prompt:
  text: |
    Review today's mixed security and ops note, extract the action items, apply the team's current scoped routing rules in your final answer, and share the source note accordingly.
    In your final answer, output one formatted line per action item using the active scoped rule for that item's scope.
    Save these current scoped rules for future mixed security and ops notes:
    - Security items use Security | <owner> | SEC-ALPHA | task | due_date.
    - Share the source note with all Security owners listed in the note.
    - Ops items use Ops | <owner> | OPS-DELTA | task | due_date.
    - Share the source note with all Ops owners listed in the note.
    Apply those saved scoped rules now.
  language: en

tools:
  - name: notes_list
    description: List meeting notes
    input_schema: {type: object, properties: {max_results: {type: integer}}, required: []}
  - name: notes_get
    description: Get meeting note details
    input_schema: {type: object, properties: {note_id: {type: string}}, required: [note_id]}
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients: {type: array, items: {type: string}}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9105/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9105/notes/get, method: POST}
  - {tool_name: notes_share, url: http://localhost:9105/notes/share, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 20

judge_rubric: "Reward an answer that saves the scoped SEC-ALPHA and OPS-DELTA defaults, applies them now, and shares the note with all Security and Ops owners."
