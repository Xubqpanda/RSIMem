status: authored
latent_rule_id: sm07_scoped_rule_migration
what_is_learned: A stored scoped routing policy where the security rule is later replaced but the ops rule must remain unchanged.
what_persists: The migrated SEC-GAMMA security rule replaces SEC-ALPHA only for Security items, while OPS-DELTA remains the durable Ops rule.
what_counts_as_reuse: Later mixed-scope tasks use SEC-GAMMA only on Security items, keep OPS-DELTA on Ops items, and share notes only with High priority Security owners plus all Ops owners.
false_positive_pattern: The agent either leaks stale SEC-ALPHA into later outputs or globally applies SEC-GAMMA to Ops items, showing scope contamination rather than selective migration.
must_demonstrate:
  - the native Hermes home fixture already contains stale Security and preserved Ops rules
  - the security rule is migrated without wiping or contaminating the ops rule
  - adjacent Security staging and unrelated Finance scopes are not globally migrated
  - later mixed-scope notes fail if stale security routing or global contamination appears
recommended_mock_services:
  - notes
phase1_canonical_sibling: SM04_rule_migration remains the clean global migration anchor; this family is the scoped migration diagnostic sibling.
future_sibling_roadmap:
  - Add a weaker embedded-update variant where only a policy memo reveals that Security changed and Ops is unchanged.
  - Add a three-scope version with one migrated scope, one preserved scope, and one newly introduced scope.
  - Add telemetry-only contamination analysis if the controller work needs more precise scope-confusion attribution.
cold_design: "Use the same mixed-scope routing workflow as eval from the stale native Hermes home fixture and judge it against the migrated target."
expected_cold_result: "Cold should reflect pre-update performance against the migrated scoped-routing target while the stale Security production rule is still seeded in Hermes home."
control_design: no_persistence removes the stored scoped rules, shortcut restates the scoped migration inline, and wrong_mechanism embeds the current scoped routing memo inside the note fixture instead of memory.
expected_control_result: Without persistence the mixed-scope migration should be hard to recover; shortcut and wrong_mechanism remain locally solvable because the scoped rule is visible in the current context.
authoring_notes: This family is aimed at D4 plus D6. Mixed-scope notes should make both stale security leakage and scope contamination visibly wrong in final output and note-sharing behavior.
