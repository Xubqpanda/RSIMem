task_id: SM07_UPDATE_001
task_name: Semantic Memory SM07 Update Security Migration
version: "1.0"
category: self_evolve
difficulty: hard

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/sm07_notes/update.json

prompt:
  text: |
    Review the scoped migration note, extract the action items, apply the team's current scoped routing rules in your final answer, and share the source note accordingly.
    In your final answer, output one formatted line per action item using the active scoped rule for that item's scope.
    Use this exact format: <Scope> | <Owner> | <RoutingToken> | <Task> | <DueDate>.
    Authoritative scoped migration for future mixed security and ops notes:
    - Security routing migrates immediately. Replace SEC-ALPHA with SEC-GAMMA for Security items.
    - Security items should still appear in the final answer, but share the source note only with High priority Security owners.
    - Ops routing is UNCHANGED. Keep OPS-DELTA for Ops items and continue sharing with all Ops owners.
    Apply the migrated scoped rules now and keep them for later similar sessions.
  language: en

tools:
  - name: notes_list
    description: List meeting notes
    input_schema: {type: object, properties: {max_results: {type: integer}}, required: []}
  - name: notes_get
    description: Get meeting note details
    input_schema: {type: object, properties: {note_id: {type: string}}, required: [note_id]}
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients: {type: array, items: {type: string}}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9105/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9105/notes/get, method: POST}
  - {tool_name: notes_share, url: http://localhost:9105/notes/share, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 20

judge_rubric: "Reward an answer that migrates only the Security rule to SEC-GAMMA, preserves OPS-DELTA for Ops, and shares the note only with High priority Security owners plus all Ops owners."
