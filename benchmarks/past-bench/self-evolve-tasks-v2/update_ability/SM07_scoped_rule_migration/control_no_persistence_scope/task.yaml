task_id: SM07_CONTROL_001
task_name: Semantic Memory SM07 Control No Persistence Scope
version: "1.0"
category: self_evolve
difficulty: hard

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9105
    health_check: http://localhost:9105/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9105/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/sm07_notes/eval_near_a.json

prompt:
  text: |
    Review today's mixed security and ops note, apply our standing scoped routing rules, and share the source note accordingly.
    In your final answer, output one formatted line per action item using the active scoped routing token for that scope, then share the source note according to those same standing rules.
    Use this exact format: <Scope> | <Owner> | <RoutingToken> | <Task> | <DueDate>.
  language: en

tools:
  - name: notes_list
    description: List meeting notes
    input_schema: {type: object, properties: {max_results: {type: integer}}, required: []}
  - name: notes_get
    description: Get meeting note details
    input_schema: {type: object, properties: {note_id: {type: string}}, required: [note_id]}
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients: {type: array, items: {type: string}}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9105/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9105/notes/get, method: POST}
  - {tool_name: notes_share, url: http://localhost:9105/notes/share, method: POST}

environment:
  timeout_seconds: 300
  max_turns: 20

judge_rubric: "No-persistence ablation. The stored scoped migration is unavailable, so later mixed-scope routing should be harder to recover."
