task_id: EP03_I06_control_no_persistence
task_name: 'EP03 Recall Then Modify — Control No Persistence'

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9205
    health_check: http://localhost:9205/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9205/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/ep03_notes/control_no_persistence.json
      PORT: "9205"

tools:
  - name: notes_list
    description: List meeting notes
    input_schema:
      type: object
      properties:
        tags:
          type: array
          items: {type: string}
      required: []
  - name: notes_get
    description: Get a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
      required: [note_id]
  - name: notes_update
    description: Update a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        payload: {type: object}
      required: [note_id, payload]
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients:
          type: array
          items: {type: string}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9205/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9205/notes/get, method: POST}
  - {tool_name: notes_update, url: http://localhost:9205/notes/update, method: POST}
  - {tool_name: notes_share, url: http://localhost:9205/notes/share, method: POST}

prompt:
  text: |
    Today's notes contain multiple onboarding note shells, but the approved
    onboarding playbook was already updated earlier in this rollout line rather
    than in today's visible notes. Recover that settled updated playbook if it
    is available, then apply it to the correct current shell record, including
    the settled mentor handoff SLA. Do not alter the title,
    participants, tags, or any other step, and do not guess from the local
    shell placeholders alone.
    Output: PLAYBOOK
  language: en

judge_rubric: "Use the same success standard as the evaluation tasks: reward applying the already-updated settled playbook to DOC-741, changing the mentor handoff line to 24 hours, and preserving the title, participants, and tags. This no-persistence control should score substantially lower once session_search access is removed, because the settled updated playbook is no longer recoverable through the expected mechanism."

max_turns: 20
timeout: 300
category: self_evolve
difficulty: medium
requires_fresh_session: true
