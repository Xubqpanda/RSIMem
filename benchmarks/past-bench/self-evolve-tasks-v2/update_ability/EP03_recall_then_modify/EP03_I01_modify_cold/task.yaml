task_id: EP03_I01_modify_cold
task_name: 'EP03 Recall Then Modify — Cold'

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9205
    health_check: http://localhost:9205/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9205/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/ep03_notes/cold.json
      PORT: "9205"

tools:
  - name: notes_list
    description: List meeting notes
    input_schema:
      type: object
      properties:
        tags:
          type: array
          items: {type: string}
      required: []
  - name: notes_get
    description: Get a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
      required: [note_id]
  - name: notes_update
    description: Update a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        payload: {type: object}
      required: [note_id, payload]
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients:
          type: array
          items: {type: string}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9205/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9205/notes/get, method: POST}
  - {tool_name: notes_update, url: http://localhost:9205/notes/update, method: POST}
  - {tool_name: notes_share, url: http://localhost:9205/notes/share, method: POST}

prompt:
  text: |
    Operations needs the settled onboarding playbook applied to the current
    shell. Recover the settled onboarding playbook from prior-session work and
    apply it to the correct current shell record. Leave shell metadata
    unchanged.
    Output: PLAYBOOK
  language: en

judge_rubric: "Cold baseline against the stale native Hermes home. Reward only a grounded update of DOC-701 that preserves the settled onboarding playbook while applying the post-update mentor handoff SLA. The seeded prior history still has the old SLA, so cold should score poorly against the post-update target."

max_turns: 20
timeout: 300
category: self_evolve
difficulty: medium
