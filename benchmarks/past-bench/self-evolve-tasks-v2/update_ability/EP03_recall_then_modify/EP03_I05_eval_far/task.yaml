task_id: EP03_I05_eval_far
task_name: 'EP03 Recall Then Modify — Eval Far'

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9205
    health_check: http://localhost:9205/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9205/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/ep03_notes/eval_far.json
      PORT: "9205"

tools:
  - name: notes_list
    description: List meeting notes
    input_schema:
      type: object
      properties:
        tags:
          type: array
          items: {type: string}
      required: []
  - name: notes_get
    description: Get a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
      required: [note_id]
  - name: notes_update
    description: Update a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        payload: {type: object}
      required: [note_id, payload]
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients:
          type: array
          items: {type: string}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9205/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9205/notes/get, method: POST}
  - {tool_name: notes_update, url: http://localhost:9205/notes/update, method: POST}
  - {tool_name: notes_share, url: http://localhost:9205/notes/share, method: POST}

prompt:
  text: |
    Today's notes contain multiple onboarding note shells, but the approved
    onboarding playbook was already updated earlier in this rollout line and
    must be recovered from prior-session work rather than inferred from today's
    notes alone. Recover that settled updated playbook first, then apply it to
    the correct current shell while preserving the settled mentor handoff SLA.
    Leave every other field unchanged.
    Output: PLAYBOOK
  language: en

judge_rubric: "Reward using session_search to recover the already-updated settled onboarding playbook, mapping it onto the matching current shell DOC-731, preserving the other three steps plus the title, participants, and tags, and keeping the mentor handoff line at 24h under the changed surface wording. Penalize reverting to the stale 48h version, editing the wrong shell, or reconstructing from current-session hints."

max_turns: 20
timeout: 300
category: self_evolve
difficulty: medium
requires_fresh_session: true
