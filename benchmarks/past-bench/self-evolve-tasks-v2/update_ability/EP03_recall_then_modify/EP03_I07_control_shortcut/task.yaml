task_id: EP03_I07_control_shortcut
task_name: 'EP03 Recall Then Modify — Control Shortcut'

services:
  - name: notes
    command: python mock_services/notes/server.py
    port: 9205
    health_check: http://localhost:9205/notes/list
    health_check_method: POST
    ready_timeout: 10
    reset_endpoint: http://localhost:9205/notes/reset
    env:
      NOTES_FIXTURES: self-evolve-tasks-v2/_shared/fixtures/ep03_notes/control_shortcut.json
      PORT: "9205"

tools:
  - name: notes_list
    description: List meeting notes
    input_schema:
      type: object
      properties:
        tags:
          type: array
          items: {type: string}
      required: []
  - name: notes_get
    description: Get a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
      required: [note_id]
  - name: notes_update
    description: Update a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        payload: {type: object}
      required: [note_id, payload]
  - name: notes_share
    description: Share a meeting note
    input_schema:
      type: object
      properties:
        note_id: {type: string}
        recipients:
          type: array
          items: {type: string}
      required: [note_id, recipients]

tool_endpoints:
  - {tool_name: notes_list, url: http://localhost:9205/notes/list, method: POST}
  - {tool_name: notes_get, url: http://localhost:9205/notes/get, method: POST}
  - {tool_name: notes_update, url: http://localhost:9205/notes/update, method: POST}
  - {tool_name: notes_share, url: http://localhost:9205/notes/share, method: POST}

prompt:
  text: |
    A local approved excerpt is visible in today's notes, and the settled
    onboarding playbook earlier in this rollout line already uses a 24-hour
    mentor handoff SLA. Apply that settled version to the correct current
    shell only, and leave every other field unchanged.
    Output: PLAYBOOK|mentor_sla_24h
  language: en

judge_rubric: "Shortcut control: reward applying the locally visible settled 24-hour mentor SLA to the matching current shell DOC-751 while preserving the rest of the approved playbook and shell metadata. Penalize editing DOC-503 or another shell instead of DOC-751."

max_turns: 20
timeout: 300
category: self_evolve
difficulty: medium
requires_fresh_session: true
