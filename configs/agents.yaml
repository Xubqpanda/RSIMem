agents:
  hermes-luna:
    description: "Hermes Agent using GPT-Luna through an OpenAI Responses-compatible endpoint."
    adapter: hermes
    install_policy: prebaked
    capabilities: [tool_use, multimodal, sandbox_file_ops]
    default_model:
      model_id: gpt-5.6-luna
      api_key_env: GPT_LUNA_API_KEY
      base_url: https://coding.tu-zi.com/v1
      extra_body:
        hermes:
          provider: openai-codex
