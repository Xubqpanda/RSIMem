[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsimem"
version = "0.1.0"
description = "Experiment instrumentation and evaluation for LightRSI memory research"
requires-python = ">=3.11"

[project.scripts]
rsimem-ledger = "rsimem.ledger:main"
rsimem-audit = "rsimem.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
