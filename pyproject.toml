[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsimem"
version = "0.1.0"
description = "Experiment instrumentation and evaluation for LightRSI memory research"
requires-python = ">=3.11,<3.12"

[project.scripts]
rsimem-ledger = "rsimem.ledger:main"
rsimem-audit = "rsimem.audit:main"
rsimem-preflight = "rsimem.preflight:main"
rsimem-analyze-matched = "rsimem.matched_analysis:main"
rsimem-prepare-adaptive = "rsimem.adaptive_preparation:main"
rsimem-activate-adaptive = "rsimem.adaptive_activation:main"
rsimem-prepare-adaptive-validation = "rsimem.adaptive_validation_runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
